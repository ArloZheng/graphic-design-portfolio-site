mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  use-system-hosts: false
  respect-rules: true

  # Bootstrap only: resolve DNS server hostnames and proxy-node hostnames.
  default-nameserver:
    - 223.5.5.5

  # Other domains use Cloudflare DoH; the DoH connection itself follows rules.
  nameserver:
    - https://1.1.1.1/dns-query

  # Dedicated bootstrap resolver for proxy-server hostnames to avoid dependency loops.
  proxy-server-nameserver:
    - 223.5.5.5

proxy-providers:
  airport:
    type: http
    url: "https://app.mitce.net/?sid=652472&token=srvjonxb"
    interval: 3600
    path: ./proxy_provider/airport.yaml
    header:
      User-Agent:
        - "clash.meta"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600

proxies:
  - name: "Oregon Residential"
    type: socks5
    server: 64.32.187.195
    port: 443
    username: "mYtvKnngzRKG"
    password: "ChzwfDZ4UC"
    udp: false
    dialer-proxy: "Airport Front"

proxy-groups:
  - name: "Airport Front"
    type: select
    use:
      - airport

  - name: "US UDP"
    type: select
    use:
      - airport
    filter: "(?i)(美国|美國|US|USA|United States|Los Angeles|Seattle|San Jose|Oregon|Portland|洛杉矶|洛杉磯|西雅图|西雅圖|圣何塞|聖何塞|俄勒冈|俄勒岡|波特兰|波特蘭)"

  - name: "Final Exit"
    type: select
    proxies:
      - "Oregon Residential"

rules:
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT,no-resolve

  - DOMAIN,stun.l.google.com,US UDP
  - DOMAIN,stun1.l.google.com,US UDP
  - DOMAIN,stun2.l.google.com,US UDP
  - DOMAIN,stun3.l.google.com,US UDP
  - DOMAIN,stun4.l.google.com,US UDP
  - DOMAIN,stun.cloudflare.com,US UDP
  - DOMAIN-SUFFIX,stun.twilio.com,US UDP
  - DST-PORT,3478,US UDP
  - DST-PORT,5349,US UDP
  - DST-PORT,19302,US UDP

  - NETWORK,UDP,US UDP
  - MATCH,Final Exit

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
tcp-concurrent: true
keep-alive-interval: 15
unified-delay: true
find-process-mode: always
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  cache-algorithm: arc
  default-nameserver:
  - 223.5.5.5
  nameserver:
  - https://1.1.1.1/dns-query
  proxy-server-nameserver:
  - 223.5.5.5
proxy-providers:
  airport:
    type: http
    url: https://app.mitce.net/?sid=652472&token=srvjonxb
    interval: 3600
    path: ./proxy_provider/airport.yaml
    header:
      User-Agent:
      - clash.meta
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
proxies:
- name: Oregon Residential
  type: socks5
  server: 64.32.187.195
  port: 443
  username: mYtvKnngzRKG
  password: ChzwfDZ4UC
  udp: false
  dialer-proxy: "Airport Front"
proxy-groups:
- name: Airport Front
  type: select
  use:
  - airport
- name: US UDP
  type: select
  use:
  - airport
  filter: ^(?:US-1TCP|US1-HY2|US2-HY2|US3-HY2|US5-HY2|US6-HY2)$
- name: Google AI
  type: select
  use:
  - airport
  filter: ^(?:US-1TCP|US1-HY2|US2-HY2|US3-HY2|US5-HY2|US6-HY2)$
- name: Final Exit
  type: select
  proxies:
  - Oregon Residential
rules:
- DOMAIN,aistudio.google.com,Google AI
- DOMAIN,ai.google.dev,Google AI
- DOMAIN-SUFFIX,generativelanguage.googleapis.com,Google AI
- DOMAIN-SUFFIX,makersuite.google.com,Google AI
- DOMAIN,stun.l.google.com,US UDP
- DOMAIN,stun1.l.google.com,US UDP
- DOMAIN,stun2.l.google.com,US UDP
- DOMAIN,stun3.l.google.com,US UDP
- DOMAIN,stun4.l.google.com,US UDP
- DOMAIN,stun.cloudflare.com,US UDP
- DOMAIN-SUFFIX,stun.twilio.com,US UDP
- DST-PORT,3478,US UDP
- DST-PORT,5349,US UDP
- DST-PORT,19302,US UDP
- AND,((DOMAIN-SUFFIX,google.com),(NETWORK,UDP),(DST-PORT,443)),REJECT
- AND,((DOMAIN-SUFFIX,googleapis.com),(NETWORK,UDP),(DST-PORT,443)),REJECT
- AND,((DOMAIN-SUFFIX,gstatic.com),(NETWORK,UDP),(DST-PORT,443)),REJECT
- AND,((DOMAIN-SUFFIX,googleusercontent.com),(NETWORK,UDP),(DST-PORT,443)),REJECT
- GEOSITE,GOOGLE,Google AI
- AND,((PROCESS-NAME-REGEX,(?i)(com\.android\.chrome|com\.huawei\.browser|com\.microsoft\.emmx|org\.mozilla\.firefox|com\.brave\.browser|com\.opera\..*|com\.kiwibrowser\.browser|com\.vivaldi\.browser|com\.google\.android\.webview|com\.android\.webview|com\.huawei\.webview|com\.openai\.chatgpt|com\.google\.android\.googlequicksearchbox)),(NETWORK,UDP)),US UDP
- GEOSITE,CN,DIRECT
- GEOIP,CN,DIRECT,no-resolve
- NETWORK,UDP,US UDP
- MATCH,Final Exit

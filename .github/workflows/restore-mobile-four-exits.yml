name: Restore mobile four exits

on:
  push:
    paths:
      - '.github/workflows/restore-mobile-four-exits.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Oregon to Final Exit only
        shell: python
        run: |
          from pathlib import Path
          p=Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml')
          lines=p.read_text(encoding='utf-8').splitlines()
          target='  - Oregon Residential'
          start=next(i for i,x in enumerate(lines) if x=='- name: Final Exit')
          proxies_line=next(i for i in range(start,len(lines)) if lines[i]=='  proxies:')
          end=next(i for i in range(proxies_line+1,len(lines)) if not lines[i].startswith('  - '))
          members=lines[proxies_line+1:end]
          if target not in members:
              lines.insert(proxies_line+1,target)
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
      - name: Commit exact repair and remove workflow
        run: |
          rm .github/workflows/restore-mobile-four-exits.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml .github/workflows/restore-mobile-four-exits.yml
          git commit -m "Restore mobile Final Exit to four residential nodes"
          git push

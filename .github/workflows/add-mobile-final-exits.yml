name: Add mobile Final Exit options

on:
  push:
    paths:
      - '.github/workflows/add-mobile-final-exits.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Add residential exits to mobile only
        shell: python
        run: |
          from pathlib import Path
          import copy, yaml

          root=Path('clash/HApiBDgfuXsS4TD7YnASWlId')
          mp=root/'mobile.yaml'
          dp=root/'desktop.yaml'
          m=yaml.safe_load(mp.read_text(encoding='utf-8-sig'))
          d=yaml.safe_load(dp.read_text(encoding='utf-8-sig'))

          airport=[p for p in m.get('proxies',[]) if p.get('type')!='socks5']
          desktop_exits=[copy.deepcopy(p) for p in d.get('proxies',[]) if p.get('type')=='socks5']
          for p in desktop_exits:
            p['dialer-proxy']='Airport Front'

          m['proxies']=airport+desktop_exits
          names=[p['name'] for p in desktop_exits]

          for g in m.get('proxy-groups',[]):
            if g.get('name')=='Final Exit':
              g.clear()
              g.update({'name':'Final Exit','type':'select','proxies':names})

          mp.write_text(yaml.safe_dump(m,allow_unicode=True,sort_keys=False,width=100000),encoding='utf-8')

      - name: Validate mobile only
        run: |
          python - <<'PY'
          import yaml
          p='clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
          d=yaml.safe_load(open(p,encoding='utf-8'))
          exits=[x for x in d['proxies'] if x.get('type')=='socks5']
          assert len(exits)>=3
          assert all(x.get('dialer-proxy')=='Airport Front' for x in exits)
          g=next(x for x in d['proxy-groups'] if x.get('name')=='Final Exit')
          assert g['type']=='select'
          assert len(g['proxies'])==len(exits)
          assert d['rules'][-1]=='MATCH,Final Exit'
          print('mobile Final Exit options restored')
          PY

      - name: Commit mobile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml
          git diff --cached --quiet || git commit -m "Restore mobile Final Exit options"
          git push

name: Purge mobile main alias caches

on:
  push:
    paths:
      - '.github/workflows/purge-mobile-main-alias.yml'

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Purge branch alias layers
        run: |
          set +e
          curl -sS 'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main' -o /tmp/purge-alias-root.json
          curl -sS 'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/' -o /tmp/purge-alias-root-slash.json
          curl -sS 'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/' -o /tmp/purge-clash-dir.json
          curl -sS 'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/' -o /tmp/purge-config-dir.json
          sleep 20
          curl -fsSL --retry 5 --retry-delay 3 'https://cdn.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' -o /tmp/mobile.yaml
      - name: Record alias purge and actual members
        shell: python
        run: |
          import yaml
          from pathlib import Path
          d=yaml.safe_load(Path('/tmp/mobile.yaml').read_text(encoding='utf-8-sig'))
          final=next(g for g in d['proxy-groups'] if g.get('name')=='Final Exit')
          parts=[]
          for title,path in [
              ('ALIAS_ROOT','/tmp/purge-alias-root.json'),
              ('ALIAS_ROOT_SLASH','/tmp/purge-alias-root-slash.json'),
              ('CLASH_DIR','/tmp/purge-clash-dir.json'),
              ('CONFIG_DIR','/tmp/purge-config-dir.json'),
          ]:
              parts.append(title+'\n'+Path(path).read_text(errors='replace'))
          parts.append('FINAL_EXIT_MEMBERS\n'+''.join('- '+x+'\n' for x in final.get('proxies',[])))
          Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile-main-alias-purge-result.txt').write_text('\n\n'.join(parts),encoding='utf-8')
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile-main-alias-purge-result.txt
          git diff --cached --quiet || git commit -m "Record mobile main alias purge result"
          git push

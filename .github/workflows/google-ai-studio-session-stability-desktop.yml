name: Stabilize Google AI Studio routing on desktop

on:
  push:
    paths:
      - '.github/workflows/google-ai-studio-session-stability-desktop.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Google QUIC fallback rules to desktop config
        shell: python
        run: |
          from pathlib import Path

          p = Path('clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml')
          s = p.read_text(encoding='utf-8-sig')

          anchor = '- DST-PORT,19302,US UDP\n'
          block = '''- DST-PORT,19302,US UDP\n- AND,((DOMAIN-SUFFIX,google.com),(NETWORK,UDP),(DST-PORT,443)),REJECT\n- AND,((DOMAIN-SUFFIX,googleapis.com),(NETWORK,UDP),(DST-PORT,443)),REJECT\n- AND,((DOMAIN-SUFFIX,gstatic.com),(NETWORK,UDP),(DST-PORT,443)),REJECT\n- AND,((DOMAIN-SUFFIX,googleusercontent.com),(NETWORK,UDP),(DST-PORT,443)),REJECT\n'''

          if 'DOMAIN-SUFFIX,googleapis.com' in s:
              print('Rules already present; no change needed')
          else:
              if anchor not in s:
                  raise SystemExit('STUN anchor not found; aborting')
              s = s.replace(anchor, block, 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit desktop update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml
          git diff --cached --quiet || git commit -m "Keep Google AI Studio desktop sessions on residential TCP exit"
          git push

name: Rename mobile Oregon node

on:
  push:
    paths:
      - '.github/workflows/rename-mobile-oregon-node.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet pyyaml
      - name: Rename only Oregon node label and Final Exit reference
        shell: python
        run: |
          from pathlib import Path
          import yaml

          p = Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml')
          text = p.read_text(encoding='utf-8')
          old = 'Oregon Residential'
          new = '俄勒冈州 205.214.55.251'
          count = text.count(old)
          assert count == 2, f'expected exactly 2 occurrences of {old!r}, got {count}'
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

          data = yaml.safe_load(text)
          final = next(g for g in data['proxy-groups'] if g.get('name') == 'Final Exit')
          expected = [
              '俄勒冈州 205.214.55.251',
              '亚利桑那州弗拉格斯塔夫 47.215.192.185',
              '纽约州纽约市 168.158.76.54',
              'Residential 198.65.47.221',
          ]
          assert final.get('proxies') == expected, final
          names = [x.get('name') for x in data.get('proxies', [])]
          assert all(x in names for x in expected), [x for x in expected if x not in names]
          assert len(names) == len(set(names)), 'duplicate proxy names found'
      - name: Commit exact rename and remove workflow
        run: |
          rm .github/workflows/rename-mobile-oregon-node.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml .github/workflows/rename-mobile-oregon-node.yml
          git commit -m "Rename mobile Oregon exit to exact IP label"
          git push origin HEAD:main

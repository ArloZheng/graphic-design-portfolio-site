name: Patch jsDelivr mobile Final Exit only

on:
  push:
    paths:
      - '.github/workflows/patch-jsdelivr-mobile-final-exit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml

      - name: Fetch the exact working mobile CDN profile as baseline
        run: |
          curl -fsSL --retry 5 --retry-delay 3 \
            'https://cdn.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' \
            -o /tmp/mobile-working-base.yaml

      - name: Add only the two missing residential exits and Final Exit members
        shell: python
        run: |
          from pathlib import Path
          import copy, yaml

          root=Path('clash/HApiBDgfuXsS4TD7YnASWlId')
          base=yaml.safe_load(Path('/tmp/mobile-working-base.yaml').read_text(encoding='utf-8-sig'))
          desktop=yaml.safe_load((root/'desktop.yaml').read_text(encoding='utf-8-sig'))

          before=copy.deepcopy(base)

          base_socks=[p for p in base.get('proxies',[]) if p.get('type')=='socks5']
          assert len(base_socks)==1, [p.get('name') for p in base_socks]
          oregon=base_socks[0]
          oregon_name=oregon['name']
          dialer=oregon.get('dialer-proxy')

          desktop_socks=[p for p in desktop.get('proxies',[]) if p.get('type')=='socks5']
          by_server={p.get('server'):copy.deepcopy(p) for p in desktop_socks}

          arizona=by_server['gate-sg.ipfoxy.io']
          newyork=by_server['168.158.76.54']
          arizona['dialer-proxy']=dialer
          newyork['dialer-proxy']=dialer

          # Keep every baseline proxy unchanged; append only the two missing residential nodes.
          base['proxies']=base['proxies']+[arizona,newyork]

          final=next(g for g in base.get('proxy-groups',[]) if g.get('name')=='Final Exit')
          final['type']='select'
          final['proxies']=[oregon_name, arizona['name'], newyork['name']]

          # Strict minimal-change verification against the exact working CDN baseline.
          for key in before:
            if key not in ('proxies','proxy-groups'):
              assert base[key]==before[key], key

          before_non_socks=[p for p in before['proxies'] if p.get('type')!='socks5']
          after_non_socks=[p for p in base['proxies'] if p.get('type')!='socks5']
          assert after_non_socks==before_non_socks
          assert base['proxies'][:len(before['proxies'])]==before['proxies']

          before_groups={g['name']:g for g in before['proxy-groups']}
          after_groups={g['name']:g for g in base['proxy-groups']}
          for name,g in before_groups.items():
            if name!='Final Exit':
              assert after_groups[name]==g, name

          old_final=copy.deepcopy(before_groups['Final Exit'])
          new_final=copy.deepcopy(after_groups['Final Exit'])
          old_final.pop('proxies',None); old_final.pop('type',None)
          new_final.pop('proxies',None); new_final.pop('type',None)
          assert old_final==new_final

          (root/'mobile.yaml').write_text(yaml.safe_dump(base,allow_unicode=True,sort_keys=False,width=100000),encoding='utf-8')

          status=(
            'baseline=exact_jsdelivr_mobile_url\n'
            'non_final_config_unchanged=true\n'
            'final_exit_type=select\n'
            'final_exit_count=3\n'
            'final_exit_names='+' | '.join(final['proxies'])+'\n'
          )
          (root/'mobile-final-exit-patch-status.txt').write_text(status,encoding='utf-8')
          print(status)

      - name: Validate patched mobile config
        run: |
          python - <<'PY'
          import yaml
          p='clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
          d=yaml.safe_load(open(p,encoding='utf-8'))
          final=next(g for g in d['proxy-groups'] if g.get('name')=='Final Exit')
          assert final['type']=='select'
          assert len(final['proxies'])==3, final
          exits={p['name']:p for p in d['proxies'] if p.get('type')=='socks5'}
          assert all(n in exits for n in final['proxies'])
          assert d['rules'][-1]=='MATCH,Final Exit'
          print('patched Final Exit verified:', final['proxies'])
          PY

      - name: Commit only mobile profile and verification status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml clash/HApiBDgfuXsS4TD7YnASWlId/mobile-final-exit-patch-status.txt
          git diff --cached --quiet || git commit -m "Patch mobile Final Exit only to three residential nodes"
          git push

      - name: Purge exact jsDelivr mobile URL
        run: |
          sleep 10
          curl -fsSL --retry 5 --retry-delay 3 \
            'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' \
            -o /tmp/purge-result.json
          cat /tmp/purge-result.json

      - name: Poll exact jsDelivr URL until three exits are visible
        shell: python
        run: |
          import subprocess,time,yaml
          from pathlib import Path
          url='https://cdn.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
          ok=False
          last=[]
          for i in range(18):
            out='/tmp/jsdelivr-check.yaml'
            subprocess.run(['curl','-fsSL','--retry','3','--retry-delay','2',url,'-o',out],check=True)
            d=yaml.safe_load(Path(out).read_text(encoding='utf-8-sig'))
            final=next(g for g in d['proxy-groups'] if g.get('name')=='Final Exit')
            last=final.get('proxies',[])
            print(f'attempt={i+1} count={len(last)} names={last}')
            if final.get('type')=='select' and len(last)==3:
              ok=True
              break
            time.sleep(20)
          Path('clash/HApiBDgfuXsS4TD7YnASWlId/jsdelivr-mobile-final-verification.txt').write_text(
            'verified='+str(ok).lower()+'\ncount='+str(len(last))+'\nnames='+' | '.join(last)+'\n',encoding='utf-8')
          if not ok:
            raise SystemExit('exact jsDelivr URL still does not expose 3 exits')

      - name: Commit exact CDN verification
        run: |
          git pull --rebase
          git add clash/HApiBDgfuXsS4TD7YnASWlId/jsdelivr-mobile-final-verification.txt
          git diff --cached --quiet || git commit -m "Verify exact jsDelivr mobile URL has three exits"
          git push

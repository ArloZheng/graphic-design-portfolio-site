name: Patch Clash mobile config

on:
  push:
    paths:
      - '.github/workflows/patch-clash-mobile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch ChatGPT routing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml')
          s = p.read_text(encoding='utf-8')

          block = '''rules:
          - AND,((DOMAIN-SUFFIX,chatgpt.com),(NETWORK,UDP),(DST-PORT,443)),REJECT
          - AND,((DOMAIN-SUFFIX,openai.com),(NETWORK,UDP),(DST-PORT,443)),REJECT
          - AND,((DOMAIN-SUFFIX,oaistatic.com),(NETWORK,UDP),(DST-PORT,443)),REJECT
          - AND,((DOMAIN-SUFFIX,oaiusercontent.com),(NETWORK,UDP),(DST-PORT,443)),REJECT
          - DOMAIN-SUFFIX,chatgpt.com,Final Exit
          - DOMAIN-SUFFIX,openai.com,Final Exit
          - DOMAIN-SUFFIX,oaistatic.com,Final Exit
          - DOMAIN-SUFFIX,oaiusercontent.com,Final Exit
          '''

          if '- DOMAIN-SUFFIX,chatgpt.com,Final Exit' not in s:
              s = s.replace('rules:\n', block, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patched config
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml
          git diff --cached --quiet || git commit -m "Fix ChatGPT fixed-IP TCP routing"
          git push

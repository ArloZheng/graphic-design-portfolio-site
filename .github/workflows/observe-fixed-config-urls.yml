name: Observe fixed config URLs

on:
  push:
    paths:
      - '.github/workflows/observe-fixed-config-urls.yml'

permissions:
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Fetch exact fixed URLs
        run: |
          curl -fsSL --retry 5 --retry-delay 3 'https://cdn.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' -o /tmp/mobile.yaml
          curl -fsSL --retry 5 --retry-delay 3 'https://cdn.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@0a4607d78f71c346e9e4ea46e20a117926d375ba/clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml' -o /tmp/desktop.yaml
      - name: Record actual Final Exit members
        shell: python
        run: |
          import yaml
          from pathlib import Path
          out=[]
          for label,path in [('MOBILE','/tmp/mobile.yaml'),('DESKTOP','/tmp/desktop.yaml')]:
              d=yaml.safe_load(Path(path).read_text(encoding='utf-8-sig'))
              final=next(g for g in d['proxy-groups'] if g.get('name')=='Final Exit')
              out.append(label+'\n'+''.join('- '+x+'\n' for x in final.get('proxies',[])))
          Path('clash/HApiBDgfuXsS4TD7YnASWlId/fixed-url-observed.txt').write_text('\n'.join(out),encoding='utf-8')
      - name: Commit observation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/fixed-url-observed.txt
          git diff --cached --quiet || git commit -m "Record actual fixed config URL members"
          git push

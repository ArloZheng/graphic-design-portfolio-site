name: Test mobile public endpoints

on:
  push:
    paths:
      - '.github/workflows/test-mobile-public-endpoints.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Fetch candidate endpoints
        shell: bash
        run: |
          set +e
          curl -L --max-time 30 -sS -w '%{http_code}' -o /tmp/raw.yaml 'https://raw.githubusercontent.com/ArloZheng/graphic-design-portfolio-site/main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' > /tmp/raw.code
          curl -L --max-time 30 -sS -w '%{http_code}' -o /tmp/pages.yaml 'https://arlozheng.github.io/graphic-design-portfolio-site/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' > /tmp/pages.code
          curl -L --max-time 30 -sS -w '%{http_code}' -o /tmp/jsd.yaml 'https://cdn.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' > /tmp/jsd.code
      - name: Validate responses
        shell: python
        run: |
          import yaml
          from pathlib import Path
          expected=[
            '俄勒冈州 205.214.55.251',
            '亚利桑那州弗拉格斯塔夫 47.215.192.185',
            '纽约州纽约市 168.158.76.54',
            'Residential 198.65.47.221',
          ]
          out=[]
          for label,path,codepath in [
            ('RAW','/tmp/raw.yaml','/tmp/raw.code'),
            ('PAGES','/tmp/pages.yaml','/tmp/pages.code'),
            ('JSDELIVR','/tmp/jsd.yaml','/tmp/jsd.code'),
          ]:
            code=Path(codepath).read_text().strip()
            ok=False
            members=[]
            err=''
            try:
              d=yaml.safe_load(Path(path).read_text(encoding='utf-8-sig'))
              final=next(g for g in d['proxy-groups'] if g.get('name')=='Final Exit')
              members=final.get('proxies',[])
              ok=(members==expected)
            except Exception as e:
              err=repr(e)
            out.append(f'{label}_HTTP={code}\n{label}_VERIFIED={str(ok).lower()}\n{label}_ERROR={err}\n'+''.join('- '+x+'\n' for x in members))
          Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile-endpoint-test.txt').write_text('\n\n'.join(out),encoding='utf-8')
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile-endpoint-test.txt
          git diff --cached --quiet || git commit -m "Record mobile endpoint test"
          git push

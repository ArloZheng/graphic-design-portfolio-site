name: Check jsDelivr mobile now

on:
  push:
    paths:
      - '.github/workflows/check-jsdelivr-mobile-now.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Fetch exact jsDelivr URL
        run: |
          curl -fsSL --retry 5 --retry-delay 3 \
            'https://cdn.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' \
            -o /tmp/mobile.yaml
      - name: Record Final Exit state
        shell: python
        run: |
          import yaml
          from pathlib import Path
          d=yaml.safe_load(Path('/tmp/mobile.yaml').read_text(encoding='utf-8-sig'))
          g=next(x for x in d['proxy-groups'] if x.get('name')=='Final Exit')
          names=g.get('proxies',[])
          text='type='+str(g.get('type'))+'\ncount='+str(len(names))+'\nnames='+' | '.join(names)+'\n'
          Path('clash/HApiBDgfuXsS4TD7YnASWlId/jsdelivr-mobile-now.txt').write_text(text,encoding='utf-8')
          print(text)
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/jsdelivr-mobile-now.txt
          git diff --cached --quiet || git commit -m "Record current jsDelivr mobile Final Exit state"
          git push

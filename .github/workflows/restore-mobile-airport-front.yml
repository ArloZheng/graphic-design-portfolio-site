name: Restore mobile residential chain to Airport Front

on:
  push:
    paths:
      - '.github/workflows/restore-mobile-airport-front.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Restore mobile residential dialer proxy
        shell: python
        run: |
          from pathlib import Path
          import yaml

          path=Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml')
          d=yaml.safe_load(path.read_text(encoding='utf-8-sig'))
          residential={
            '纽约州纽约市 168.158.76.54',
            '俄勒冈州 205.214.55.251',
            '亚利桑那州弗拉格斯塔夫 47.215.192.185',
          }
          for p in d.get('proxies',[]):
              if isinstance(p,dict) and p.get('name') in residential:
                  p['dialer-proxy']='Airport Front'
                  p['ip-version']='ipv4'

          for g in d.get('proxy-groups',[]):
              if isinstance(g,dict) and g.get('name')=='Final Exit':
                  g.pop('url',None)
                  g.pop('interval',None)
                  g.pop('timeout',None)
                  g.pop('expected-status',None)

          path.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=100000),encoding='utf-8')

      - name: Validate
        run: |
          python - <<'PY'
          import yaml
          p='clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
          d=yaml.safe_load(open(p,encoding='utf-8'))
          residential={'纽约州纽约市 168.158.76.54','俄勒冈州 205.214.55.251','亚利桑那州弗拉格斯塔夫 47.215.192.185'}
          for pxy in d['proxies']:
              if pxy.get('name') in residential:
                  assert pxy.get('dialer-proxy')=='Airport Front'
          final=next(g for g in d['proxy-groups'] if g['name']=='Final Exit')
          for k in ('url','interval','timeout','expected-status'):
              assert k not in final
          print('mobile residential chain restored to Airport Front')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml
          git diff --cached --quiet || git commit -m "Restore mobile residential chain to Airport Front"
          git push

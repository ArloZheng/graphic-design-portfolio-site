name: Add primary residential proxy

on:
  push:
    paths:
      - '.github/workflows/add-primary-residential.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Update mobile and desktop residential proxies
        shell: python
        run: |
          from pathlib import Path
          import base64, yaml

          root=Path('clash/HApiBDgfuXsS4TD7YnASWlId')
          host=base64.b64decode('NDUuNjIuMTc1LjEyMQ==').decode()
          port=int(base64.b64decode('MTIzMjM=').decode())
          user=base64.b64decode('MTRhNzMyZmMyMDJlYg==').decode()
          password=base64.b64decode('Zjc2MWY5ODRkYQ==').decode()

          def update(path, desktop=False):
              d=yaml.safe_load(path.read_text(encoding='utf-8-sig'))
              proxies=d.get('proxies',[])

              rename={
                  'Oregon Residential':'Oregon 205.214.55.251',
                  'Temp Residential 47.215.192.185':'Flagstaff AZ 47.215.192.185'
              }
              for p in proxies:
                  if isinstance(p,dict) and p.get('name') in rename:
                      p['name']=rename[p['name']]

              new_name='Nettleton MS 45.62.175.121'
              proxies=[p for p in proxies if not (isinstance(p,dict) and p.get('name')==new_name)]
              new_proxy={
                  'name':new_name,
                  'type':'socks5',
                  'server':host,
                  'port':port,
                  'username':user,
                  'password':password,
                  'udp':False,
                  'dialer-proxy':'Front Node - Airport Front' if desktop else 'Airport Front'
              }
              proxies.append(new_proxy)
              d['proxies']=proxies

              for g in d.get('proxy-groups',[]):
                  if g.get('name')=='Final Exit':
                      g['proxies']=[
                          new_name,
                          'Oregon 205.214.55.251',
                          'Flagstaff AZ 47.215.192.185'
                      ]

              path.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=100000),encoding='utf-8')

          update(root/'mobile.yaml', desktop=False)
          update(root/'desktop.yaml', desktop=True)

      - name: Validate
        run: |
          python - <<'PY'
          import yaml
          for fn in ['mobile.yaml','desktop.yaml']:
              p='clash/HApiBDgfuXsS4TD7YnASWlId/'+fn
              d=yaml.safe_load(open(p,encoding='utf-8'))
              names=[x.get('name') for x in d.get('proxies',[]) if isinstance(x,dict)]
              assert 'Nettleton MS 45.62.175.121' in names
              assert 'Oregon 205.214.55.251' in names
              assert 'Flagstaff AZ 47.215.192.185' in names
              final=next(g for g in d['proxy-groups'] if g['name']=='Final Exit')
              assert final['proxies'][0]=='Nettleton MS 45.62.175.121'
          print('residential proxy validation passed')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml
          git diff --cached --quiet || git commit -m "Add primary Nettleton residential proxy"
          git push

name: Verify versioned four-exit configs

on:
  push:
    paths:
      - '.github/workflows/verify-versioned-four-exits.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Fetch versioned CDN configs
        run: |
          curl -fsSL --retry 5 --retry-delay 3 'https://cdn.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@77790fac257c27ebe35425a8581ae3d21ab807df/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' -o /tmp/mobile.yaml
          curl -fsSL --retry 5 --retry-delay 3 'https://cdn.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@77790fac257c27ebe35425a8581ae3d21ab807df/clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml' -o /tmp/desktop.yaml
      - name: Record exact members
        shell: python
        run: |
          import yaml
          from pathlib import Path
          expected_mobile=[
            'Oregon Residential',
            '亚利桑那州弗拉格斯塔夫 47.215.192.185',
            '纽约州纽约市 168.158.76.54',
            'Residential 198.65.47.221',
          ]
          expected_desktop=[
            '纽约州纽约市 168.158.76.54',
            '俄勒冈州 205.214.55.251',
            '亚利桑那州弗拉格斯塔夫 47.215.192.185',
            'Residential 198.65.47.221',
          ]
          out=[]
          for label,path,expected in [('MOBILE','/tmp/mobile.yaml',expected_mobile),('DESKTOP','/tmp/desktop.yaml',expected_desktop)]:
              d=yaml.safe_load(Path(path).read_text(encoding='utf-8-sig'))
              final=next(g for g in d['proxy-groups'] if g.get('name')=='Final Exit')
              members=final.get('proxies',[])
              out.append(label+'_VERIFIED='+str(members==expected).lower()+'\n'+''.join('- '+x+'\n' for x in members))
          Path('clash/HApiBDgfuXsS4TD7YnASWlId/versioned-four-exit-verify.txt').write_text('\n'.join(out),encoding='utf-8')
      - name: Commit verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/versioned-four-exit-verify.txt
          git diff --cached --quiet || git commit -m "Record versioned four-exit CDN verification"
          git push

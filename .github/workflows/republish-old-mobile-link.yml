name: Republish old mobile link

on:
  push:
    paths:
      - '.github/workflows/republish-old-mobile-link.yml'

permissions:
  contents: write

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Republish repaired config to original mobile path
        run: |
          cp clash/HApiBDgfuXsS4TD7YnASWlId/mobile-v2.yaml clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml
          printf '\n# republished-original-mobile-link\n' >> clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml
      - name: Commit original mobile path refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml
          git diff --cached --quiet || git commit -m "Republish repaired config on original mobile URL"
          git push

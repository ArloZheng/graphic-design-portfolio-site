name: Restore mobile baseline and apply delay test fix

on:
  push:
    paths:
      - '.github/workflows/restore-mobile-baseline-and-delay-fix.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet pyyaml
      - name: Restore pre-repair mobile baseline then change only Final Exit delay test
        shell: bash
        run: |
          TARGET='clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
          git show 4775ba69f430fbc47a519c4cd8a2453a4cb8d1ff:"$TARGET" > "$TARGET"
          python - <<'PY'
          from pathlib import Path
          import yaml
          path=Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml')
          d=yaml.safe_load(path.read_text(encoding='utf-8-sig'))
          for g in d.get('proxy-groups',[]):
              if isinstance(g,dict) and g.get('name')=='Final Exit':
                  g['url']='https://www.gstatic.com/generate_204'
                  g['timeout']=5000
                  g['expected-status']=204
                  g.pop('interval',None)
          path.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=100000),encoding='utf-8')
          PY
      - name: Validate exact chain plus delay test
        run: |
          python - <<'PY'
          import yaml
          p='clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
          d=yaml.safe_load(open(p,encoding='utf-8'))
          residential={'纽约州纽约市 168.158.76.54','俄勒冈州 205.214.55.251','亚利桑那州弗拉格斯塔夫 47.215.192.185'}
          for pxy in d['proxies']:
              if pxy.get('name') in residential:
                  assert pxy.get('dialer-proxy')=='US Transit'
          assert all(g.get('name') not in {'住宅前置自动选择','Residential Front'} for g in d['proxy-groups'])
          final=next(g for g in d['proxy-groups'] if g['name']=='Final Exit')
          assert final['url']=='https://www.gstatic.com/generate_204'
          assert final['timeout']==5000
          assert final['expected-status']==204
          assert 'interval' not in final
          print('baseline restored; only Final Exit delay test tuned')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml
          git diff --cached --quiet || git commit -m "Restore mobile baseline and fix delay test target"
          git push

name: Remove Arizona and normalize residential exit names

on:
  push:
    paths:
      - '.github/workflows/remove-arizona-rename-exits.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet pyyaml
      - name: Update mobile and desktop configs safely
        shell: python
        run: |
          from pathlib import Path
          import yaml

          paths = [
              Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'),
              Path('clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml'),
          ]

          remove_name = '亚利桑那州弗拉格斯塔夫 47.215.192.185'
          renames = {
              '俄勒冈州 205.214.55.251': '美国俄勒冈州 205.214.55.251',
              '纽约州纽约市 168.158.76.54': '美国纽约市 168.158.76.54',
              'Residential 198.65.47.221': '美国 198.65.47.221',
          }
          expected = [
              '美国俄勒冈州 205.214.55.251',
              '美国纽约市 168.158.76.54',
              '美国 198.65.47.221',
          ]

          def remove_proxy_block(text: str, name: str) -> str:
              lines = text.splitlines()
              target = f'- name: {name}'
              try:
                  start = next(i for i, line in enumerate(lines) if line == target)
              except StopIteration:
                  return text
              end = start + 1
              while end < len(lines) and not lines[end].startswith('- name: ') and lines[end] != 'proxy-groups:':
                  end += 1
              del lines[start:end]
              return '\n'.join(lines) + '\n'

          for p in paths:
              text = p.read_text(encoding='utf-8')
              text = remove_proxy_block(text, remove_name)
              # remove group reference for the Arizona exit only
              text = text.replace(f'  - {remove_name}\n', '')
              for old, new in renames.items():
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

              data = yaml.safe_load(text)
              proxies = data.get('proxies', [])
              names = [x.get('name') for x in proxies]
              assert remove_name not in names, f'{p}: Arizona proxy still exists'
              assert remove_name not in str(data), f'{p}: Arizona reference still exists'
              for name in expected:
                  assert name in names, f'{p}: missing proxy {name}'
              assert len(names) == len(set(names)), f'{p}: duplicate proxy names'
              final = next(g for g in data.get('proxy-groups', []) if g.get('name') == 'Final Exit')
              members = final.get('proxies', [])
              for name in expected:
                  assert name in members, f'{p}: Final Exit missing {name}'
              assert remove_name not in members, f'{p}: Final Exit still has Arizona'
              assert len(members) == 3, f'{p}: Final Exit should have 3 members, got {members}'
      - name: Commit exact config update and remove workflow
        run: |
          rm .github/workflows/remove-arizona-rename-exits.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml .github/workflows/remove-arizona-rename-exits.yml
          git commit -m "Remove Arizona exit and normalize residential exit names"
          git push origin HEAD:main

name: Publish mobile v2 profile

on:
  push:
    paths:
      - '.github/workflows/publish-mobile-v2.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy repaired mobile profile to a fresh URL path
        run: |
          cp clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml clash/HApiBDgfuXsS4TD7YnASWlId/mobile-v2.yaml
      - name: Commit fresh mobile profile path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile-v2.yaml
          git diff --cached --quiet || git commit -m "Publish fresh mobile v2 profile"
          git push

name: Normalize mobile Final Exit

on:
  push:
    paths:
      - '.github/workflows/normalize-mobile-final-exit.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Normalize mobile residential exit names and group
        shell: python
        run: |
          from pathlib import Path
          import yaml

          p=Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml')
          d=yaml.safe_load(p.read_text(encoding='utf-8-sig'))

          name_by_server={
            '205.214.55.251':'Oregon Residential',
            'gate-sg.ipfoxy.io':'Arizona Residential',
            '168.158.76.54':'New York Residential',
          }

          exits=[]
          for proxy in d.get('proxies',[]):
            if proxy.get('type')=='socks5' and proxy.get('server') in name_by_server:
              proxy['name']=name_by_server[proxy['server']]
              proxy['dialer-proxy']='Airport Front'
              exits.append(proxy['name'])

          expected=['Oregon Residential','Arizona Residential','New York Residential']
          assert exits==expected or set(exits)==set(expected), exits

          final=next(g for g in d.get('proxy-groups',[]) if g.get('name')=='Final Exit')
          final.clear()
          final.update({'name':'Final Exit','type':'select','proxies':expected})

          p.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=100000),encoding='utf-8')

      - name: Validate repository mobile config
        run: |
          python - <<'PY'
          import yaml
          p='clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
          d=yaml.safe_load(open(p,encoding='utf-8'))
          final=next(g for g in d['proxy-groups'] if g.get('name')=='Final Exit')
          expected=['Oregon Residential','Arizona Residential','New York Residential']
          assert final['type']=='select'
          assert final['proxies']==expected
          exits={x['name']:x for x in d['proxies'] if x.get('type')=='socks5'}
          assert all(n in exits for n in expected)
          assert all(exits[n].get('dialer-proxy')=='Airport Front' for n in expected)
          print('repo mobile Final Exit verified:', final['proxies'])
          PY

      - name: Commit mobile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml
          git diff --cached --quiet || git commit -m "Normalize mobile Final Exit to three residential nodes"
          git push

      - name: Purge jsDelivr and record exact fixed URL content
        run: |
          sleep 10
          curl -fsSL --retry 5 --retry-delay 2 \
            'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' \
            -o /tmp/purge.json
          cat /tmp/purge.json
          sleep 25
          curl -fsSL --retry 5 --retry-delay 3 \
            'https://cdn.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' \
            -o /tmp/mobile-cdn.yaml
          python - <<'PY'
          import yaml
          from pathlib import Path
          d=yaml.safe_load(open('/tmp/mobile-cdn.yaml',encoding='utf-8'))
          final=next(g for g in d['proxy-groups'] if g.get('name')=='Final Exit')
          names=final.get('proxies',[])
          exits={x['name']:x for x in d.get('proxies',[]) if x.get('type')=='socks5'}
          status=(
            'cdn_fetch_ok=true\n'
            f'final_exit_count={len(names)}\n'
            'final_exit_names='+' | '.join(names)+'\n'
            'all_group_members_defined='+str(all(n in exits for n in names)).lower()+'\n'
            'all_dialer_airport_front='+str(all(exits.get(n,{}).get('dialer-proxy')=='Airport Front' for n in names)).lower()+'\n'
          )
          Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile-cdn-observed.txt').write_text(status,encoding='utf-8')
          print(status)
          PY

      - name: Commit observed CDN state
        run: |
          git pull --rebase
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile-cdn-observed.txt
          git diff --cached --quiet || git commit -m "Record observed mobile CDN Final Exit state"
          git push

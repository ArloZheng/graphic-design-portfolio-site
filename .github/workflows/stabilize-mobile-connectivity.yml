name: Stabilize mobile connectivity

on:
  push:
    paths:
      - '.github/workflows/stabilize-mobile-connectivity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Stabilize mobile routing and DNS
        shell: python
        run: |
          from pathlib import Path
          import yaml

          p = Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml')
          d = yaml.safe_load(p.read_text(encoding='utf-8-sig'))

          d['find-process-mode'] = 'strict'

          dns = d.setdefault('dns', {})
          dns['default-nameserver'] = ['223.5.5.5', '119.29.29.29']
          dns['proxy-server-nameserver'] = ['223.5.5.5', '119.29.29.29']
          dns['nameserver-policy'] = {'geosite:cn': ['223.5.5.5', '119.29.29.29']}
          dns['direct-nameserver'] = ['223.5.5.5', '119.29.29.29']
          dns['direct-nameserver-follow-policy'] = True

          groups = d.get('proxy-groups', [])
          front = next(g for g in groups if g.get('name') == 'Airport Front')
          all_nodes = list(dict.fromkeys(front.get('proxies', [])))
          front.clear()
          front.update({
              'name': 'Airport Front',
              'type': 'url-test',
              'proxies': all_nodes,
              'url': 'https://www.gstatic.com/generate_204',
              'interval': 300,
              'tolerance': 80,
              'lazy': True,
          })

          rules = d.get('rules', [])
          lan_rules = [
              'IP-CIDR,10.0.0.0/8,DIRECT,no-resolve',
              'IP-CIDR,172.16.0.0/12,DIRECT,no-resolve',
              'IP-CIDR,192.168.0.0/16,DIRECT,no-resolve',
              'IP-CIDR,127.0.0.0/8,DIRECT,no-resolve',
          ]
          rules = [r for r in rules if r not in lan_rules]
          insert_at = next((i for i,r in enumerate(rules) if isinstance(r,str) and r.startswith('GEOSITE,CN,')), len(rules))
          rules[insert_at:insert_at] = lan_rules
          d['rules'] = rules

          p.write_text(yaml.safe_dump(d, allow_unicode=True, sort_keys=False, width=100000), encoding='utf-8')

      - name: Validate mobile config
        run: |
          python - <<'PY'
          import yaml
          p='clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
          d=yaml.safe_load(open(p,encoding='utf-8'))
          groups={g.get('name'):g for g in d['proxy-groups']}
          assert groups['Airport Front']['type']=='url-test'
          assert len(groups['Airport Front']['proxies']) >= 40
          assert groups['US Transit']['proxies']==['US-1TCP','US1-HY2','US2-HY2','US3-HY2','US5-HY2','US6-HY2']
          r=next(x for x in d['proxies'] if x.get('name')=='Oregon Residential')
          assert r['server']=='205.214.55.251'
          assert r['dialer-proxy']=='Airport Front'
          assert d['rules'][-1]=='MATCH,Final Exit'
          print('mobile connectivity validation passed')
          PY

      - name: Commit stabilized mobile config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml
          git diff --cached --quiet || git commit -m "Stabilize mobile chain connectivity"
          git push

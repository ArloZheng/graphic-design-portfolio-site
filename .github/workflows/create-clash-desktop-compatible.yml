name: Patch Clash subscription routing

on:
  push:
    paths:
      - '.github/workflows/create-clash-desktop-compatible.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Patch subscription files
        shell: python
        run: |
          from pathlib import Path
          import yaml

          root = Path('clash/HApiBDgfuXsS4TD7YnASWlId')
          nodes = ['US-1TCP','US1-HY2','US2-HY2','US3-HY2','US5-HY2','US6-HY2']
          ai_rules = [
              'DOMAIN,aistudio.google.com,US Transit',
              'DOMAIN,gemini.google.com,US Transit',
              'DOMAIN,ai.google.dev,US Transit',
              'DOMAIN,generativelanguage.googleapis.com,US Transit',
              'DOMAIN,makersuite.google.com,US Transit',
          ]

          for filename in ['mobile.yaml', 'desktop.yaml']:
              path = root / filename
              doc = yaml.safe_load(path.read_text(encoding='utf-8-sig'))

              groups = []
              added = False
              for g in doc.get('proxy-groups', []):
                  if isinstance(g, dict) and g.get('name') in ['US UDP', 'Google AI', 'US Transit']:
                      if not added:
                          groups.append({'name':'US Transit','type':'select','proxies':nodes})
                          added = True
                      continue
                  groups.append(g)
              doc['proxy-groups'] = groups

              rules = []
              for r in doc.get('rules', []):
                  if not isinstance(r, str):
                      rules.append(r)
                      continue
                  if r.startswith(('DOMAIN,aistudio.google.com,','DOMAIN,gemini.google.com,','DOMAIN,ai.google.dev,','DOMAIN,generativelanguage.googleapis.com,','DOMAIN-SUFFIX,generativelanguage.googleapis.com,','DOMAIN,makersuite.google.com,','DOMAIN-SUFFIX,makersuite.google.com,','GEOSITE,GOOGLE,')):
                      continue
                  rules.append(r.replace(',US UDP', ',US Transit').replace(',Google AI', ',US Transit'))
              doc['rules'] = ai_rules + rules

              path.write_text(yaml.safe_dump(doc, allow_unicode=True, sort_keys=False, width=100000), encoding='utf-8')

      - name: Validate YAML
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          root = Path('clash/HApiBDgfuXsS4TD7YnASWlId')
          for f in ['mobile.yaml','desktop.yaml']:
              doc = yaml.safe_load((root/f).read_text(encoding='utf-8'))
              names = [g.get('name') for g in doc.get('proxy-groups',[]) if isinstance(g,dict)]
              assert names.count('US Transit') == 1
              assert 'US UDP' not in names
              assert 'Google AI' not in names
              assert 'DOMAIN,aistudio.google.com,US Transit' in doc['rules']
              assert 'DOMAIN,gemini.google.com,US Transit' in doc['rules']
              assert 'NETWORK,UDP,US Transit' in doc['rules']
              assert doc['rules'][-1] == 'MATCH,Final Exit'
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml
          git diff --cached --quiet || git commit -m "Unify Google AI and UDP under US Transit"
          git push

name: Patch Clash subscription routing

on:
  push:
    paths:
      - '.github/workflows/create-clash-desktop-compatible.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Patch subscription files from Google AI whitelist
        shell: python
        run: |
          from pathlib import Path
          import yaml

          root = Path('clash/HApiBDgfuXsS4TD7YnASWlId')
          nodes = ['US-1TCP','US1-HY2','US2-HY2','US3-HY2','US5-HY2','US6-HY2']

          whitelist = [
              'aistudio.google.com',
              'gemini.google.com',
              'ai.google.dev',
              'generativelanguage.googleapis.com',
              'makersuite.google.com',
              'alkalimakersuite-pa.clients6.google.com',
              'accounts.google.com',
              'oauth2.googleapis.com',
              'people.googleapis.com',
              'identitytoolkit.googleapis.com',
              'securetoken.googleapis.com',
              'firebaseinstallations.googleapis.com',
          ]

          for filename in ['mobile.yaml', 'desktop.yaml']:
              path = root / filename
              doc = yaml.safe_load(path.read_text(encoding='utf-8-sig'))

              groups = []
              added = False
              for group in doc.get('proxy-groups', []):
                  if isinstance(group, dict) and group.get('name') in ['US UDP', 'Google AI', 'US Transit']:
                      if not added:
                          groups.append({'name':'US Transit','type':'select','proxies':nodes})
                          added = True
                      continue
                  groups.append(group)
              doc['proxy-groups'] = groups

              old = []
              for rule in doc.get('rules', []):
                  if not isinstance(rule, str):
                      old.append(rule)
                      continue
                  if rule.startswith('DOMAIN,'):
                      parts = rule.split(',')
                      if len(parts) >= 3 and parts[1] in whitelist:
                          continue
                  if rule.startswith('GEOSITE,GOOGLE,'):
                      continue
                  old.append(rule.replace(',US UDP', ',US Transit').replace(',Google AI', ',US Transit'))

              whitelist_rules = [f'DOMAIN,{domain},US Transit' for domain in whitelist]
              doc['rules'] = whitelist_rules + old
              path.write_text(yaml.safe_dump(doc, allow_unicode=True, sort_keys=False, width=100000), encoding='utf-8')

      - name: Validate YAML and whitelist routing
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          root = Path('clash/HApiBDgfuXsS4TD7YnASWlId')
          for filename in ['mobile.yaml','desktop.yaml']:
              doc = yaml.safe_load((root/filename).read_text(encoding='utf-8'))
              names = [g.get('name') for g in doc.get('proxy-groups',[]) if isinstance(g,dict)]
              assert names.count('US Transit') == 1
              assert 'US UDP' not in names
              assert 'Google AI' not in names
              rules = doc['rules']
              assert 'DOMAIN,aistudio.google.com,US Transit' in rules
              assert 'DOMAIN,gemini.google.com,US Transit' in rules
              assert 'DOMAIN,alkalimakersuite-pa.clients6.google.com,US Transit' in rules
              assert 'NETWORK,UDP,US Transit' in rules
              assert rules[-1] == 'MATCH,Final Exit'
          print('Whitelist routing checks passed')
          PY

      - name: Commit updated subscription files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml
          git diff --cached --quiet || git commit -m "Route Google AI whitelist through US Transit"
          git push

name: Build desktop Clash config from mobile and airport subscription

on:
  push:
    paths:
      - 'clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
      - '.github/workflows/create-clash-desktop-compatible.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install YAML dependency
        run: python -m pip install --quiet pyyaml requests

      - name: Enforce mobile US Transit routing
        shell: python
        run: |
          from pathlib import Path
          import yaml

          src = Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml')
          doc = yaml.safe_load(src.read_text(encoding='utf-8-sig'))
          selected = ['US-1TCP','US1-HY2','US2-HY2','US3-HY2','US5-HY2','US6-HY2']

          groups = []
          inserted = False
          for g in doc.get('proxy-groups') or []:
              if isinstance(g, dict) and g.get('name') in {'US UDP','Google AI','US Transit'}:
                  if not inserted:
                      groups.append({'name':'US Transit','type':'select','proxies':selected})
                      inserted = True
                  continue
              groups.append(g)
          if not inserted:
              pos = next((i+1 for i,g in enumerate(groups) if isinstance(g,dict) and g.get('name')=='Airport Front'), len(groups))
              groups.insert(pos, {'name':'US Transit','type':'select','proxies':selected})
          doc['proxy-groups'] = groups

          precise = [
              'DOMAIN,aistudio.google.com,US Transit',
              'DOMAIN,gemini.google.com,US Transit',
              'DOMAIN,ai.google.dev,US Transit',
              'DOMAIN,generativelanguage.googleapis.com,US Transit',
              'DOMAIN,makersuite.google.com,US Transit',
          ]

          rules = []
          for r in doc.get('rules') or []:
              if not isinstance(r, str):
                  rules.append(r)
                  continue
              if r.startswith(('DOMAIN,aistudio.google.com,','DOMAIN,gemini.google.com,','DOMAIN,ai.google.dev,','DOMAIN,generativelanguage.googleapis.com,','DOMAIN-SUFFIX,generativelanguage.googleapis.com,','DOMAIN,makersuite.google.com,','DOMAIN-SUFFIX,makersuite.google.com,','GEOSITE,GOOGLE,')):
                  continue
              r = r.replace(',US UDP', ',US Transit').replace(',Google AI', ',US Transit')
              rules.append(r)
          doc['rules'] = precise + rules

          src.write_text(yaml.safe_dump(doc, allow_unicode=True, sort_keys=False, width=100000), encoding='utf-8')

      - name: Build desktop config with inline airport nodes
        shell: python
        run: |
          from pathlib import Path
          import requests
          import yaml

          src = Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml')
          dst = Path('clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml')

          mobile = yaml.safe_load(src.read_text(encoding='utf-8'))
          if not isinstance(mobile, dict):
              raise SystemExit('mobile.yaml is not a YAML mapping; aborting')

          provider = (mobile.get('proxy-providers') or {}).get('airport') or {}
          url = provider.get('url')
          if not url:
              raise SystemExit('airport provider URL missing; aborting')

          headers = {'User-Agent': 'clash.meta'}
          response = requests.get(url, headers=headers, timeout=45)
          response.raise_for_status()

          airport_doc = yaml.safe_load(response.text)
          airport_nodes = airport_doc.get('proxies') if isinstance(airport_doc, dict) else None
          if not isinstance(airport_nodes, list) or not airport_nodes:
              raise SystemExit('airport subscription did not return a non-empty Clash/Mihomo proxies list')

          mobile.pop('proxy-providers', None)
          existing = mobile.get('proxies') or []
          mobile['proxies'] = airport_nodes + existing

          all_names = [p.get('name') for p in airport_nodes if isinstance(p, dict) and p.get('name')]
          selected_us = ['US-1TCP','US1-HY2','US2-HY2','US3-HY2','US5-HY2','US6-HY2']
          us_names = [name for name in selected_us if name in all_names]

          if not all_names:
              raise SystemExit('airport subscription proxies have no usable names; aborting')
          if not us_names:
              raise SystemExit('no selected US nodes found for desktop US Transit group; aborting')

          for group in mobile.get('proxy-groups') or []:
              if not isinstance(group, dict):
                  continue
              name = group.get('name')
              if name == 'Airport Front':
                  group.pop('use', None)
                  group.pop('filter', None)
                  group['proxies'] = all_names
              elif name == 'US Transit':
                  group.pop('use', None)
                  group.pop('filter', None)
                  group['proxies'] = us_names

          rules = mobile.get('rules') or []
          android_marker = 'com\\.android\\.chrome'
          win_rule = r'AND,((PROCESS-NAME-REGEX,(?i)(chrome\.exe|msedge\.exe|firefox\.exe|brave\.exe|opera\.exe|vivaldi\.exe|arc\.exe)),(NETWORK,UDP)),US Transit'
          replaced = False
          for i, rule in enumerate(rules):
              if isinstance(rule, str) and android_marker in rule:
                  rules[i] = win_rule
                  replaced = True
                  break
          if not replaced:
              raise SystemExit('Android browser UDP rule not found; aborting without changing desktop.yaml')

          dst.write_text(yaml.safe_dump(mobile, allow_unicode=True, sort_keys=False, width=100000), encoding='utf-8')

      - name: Validate YAML
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          for p in [Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'), Path('clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml')]:
              doc = yaml.safe_load(p.read_text(encoding='utf-8'))
              assert isinstance(doc, dict)
              names = [g.get('name') for g in doc.get('proxy-groups', []) if isinstance(g, dict)]
              assert 'US Transit' in names
              assert 'US UDP' not in names
              assert 'Google AI' not in names
              rules = doc.get('rules') or []
              assert 'DOMAIN,aistudio.google.com,US Transit' in rules
              assert 'DOMAIN,gemini.google.com,US Transit' in rules
              assert 'NETWORK,UDP,US Transit' in rules
              assert rules[-1] == 'MATCH,Final Exit'
          print('YAML and routing checks passed')
          PY

      - name: Commit mobile and desktop configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml
          git diff --cached --quiet || git commit -m "Build unified US Transit Clash configs"
          git push

name: Align mobile dedicated chain with working desktop

on:
  push:
    paths:
      - '.github/workflows/align-mobile-dedicated-with-desktop-chain.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Align dedicated mobile chain with desktop working chain
        shell: python
        run: |
          from pathlib import Path
          import yaml

          path=Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile-dedicated.yaml')
          d=yaml.safe_load(path.read_text(encoding='utf-8-sig'))

          residential={
            '纽约州纽约市 168.158.76.54',
            '俄勒冈州 205.214.55.251',
            '亚利桑那州弗拉格斯塔夫 47.215.192.185',
          }

          for p in d.get('proxies',[]):
              if isinstance(p,dict) and p.get('name') in residential:
                  p['udp']=False
                  p['dialer-proxy']='US-1TCP'
                  p['ip-version']='ipv4'

          # Remove the extra indirection group from the residential chain.
          d['proxy-groups']=[g for g in d.get('proxy-groups',[]) if g.get('name')!='手机前置']
          for g in d.get('proxy-groups',[]):
              if g.get('name')=='住宅出口':
                  g['type']='select'
                  g['proxies']=['纽约州纽约市 168.158.76.54','俄勒冈州 205.214.55.251','亚利桑那州弗拉格斯塔夫 47.215.192.185']
                  g['url']='http://captive.apple.com/hotspot-detect.html'
                  g['interval']=300

          # Match desktop UDP behavior: UDP goes to the direct airport front, not residential.
          rules=[]
          for r in d.get('rules',[]):
              if r=='NETWORK,UDP,手机前置':
                  rules.append('NETWORK,UDP,US-1TCP')
              else:
                  rules.append(r)
          d['rules']=rules

          path.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=100000),encoding='utf-8')

      - name: Validate exact chain
        run: |
          python - <<'PY'
          import yaml
          p='clash/HApiBDgfuXsS4TD7YnASWlId/mobile-dedicated.yaml'
          d=yaml.safe_load(open(p,encoding='utf-8'))
          residential={'纽约州纽约市 168.158.76.54','俄勒冈州 205.214.55.251','亚利桑那州弗拉格斯塔夫 47.215.192.185'}
          for pxy in d['proxies']:
              if pxy.get('name') in residential:
                  assert pxy.get('dialer-proxy')=='US-1TCP'
                  assert pxy.get('udp') is False
          assert all(g.get('name')!='手机前置' for g in d['proxy-groups'])
          assert 'NETWORK,UDP,US-1TCP' in d['rules']
          print('dedicated mobile chain now matches working desktop residential chain')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile-dedicated.yaml
          git diff --cached --quiet || git commit -m "Align mobile dedicated chain with desktop"
          git push

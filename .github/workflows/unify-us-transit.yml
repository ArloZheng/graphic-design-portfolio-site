name: Unify US Transit routing

on:
  push:
    paths:
      - '.github/workflows/unify-us-transit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install YAML dependency
        run: python -m pip install --quiet pyyaml

      - name: Backup and patch persistent configs
        shell: python
        run: |
          from pathlib import Path
          import shutil
          import yaml

          root = Path('clash/HApiBDgfuXsS4TD7YnASWlId')
          mobile_path = root / 'mobile.yaml'
          desktop_path = root / 'desktop.yaml'
          backup_dir = Path('backups/clash-before-us-transit')
          backup_dir.mkdir(parents=True, exist_ok=True)
          shutil.copy2(mobile_path, backup_dir / 'mobile.yaml')
          shutil.copy2(desktop_path, backup_dir / 'desktop.yaml')

          selected = ['US-1TCP','US1-HY2','US2-HY2','US3-HY2','US5-HY2','US6-HY2']
          exact_filter = '^(?:' + '|'.join(selected) + ')$'

          mobile = yaml.safe_load(mobile_path.read_text(encoding='utf-8-sig'))
          groups = mobile.get('proxy-groups') or []
          new_groups = []
          transit_done = False
          for g in groups:
              name = g.get('name') if isinstance(g, dict) else None
              if name in {'US UDP', 'Google AI', 'US Transit'}:
                  if not transit_done:
                      new_groups.append({
                          'name': 'US Transit',
                          'type': 'select',
                          'use': ['airport'],
                          'filter': exact_filter,
                      })
                      transit_done = True
                  continue
              new_groups.append(g)
          if not transit_done:
              insert_at = next((i+1 for i,g in enumerate(new_groups) if isinstance(g,dict) and g.get('name')=='Airport Front'), len(new_groups))
              new_groups.insert(insert_at, {'name':'US Transit','type':'select','use':['airport'],'filter':exact_filter})
          mobile['proxy-groups'] = new_groups

          precise_ai = [
              'DOMAIN,aistudio.google.com,US Transit',
              'DOMAIN,gemini.google.com,US Transit',
              'DOMAIN,ai.google.dev,US Transit',
              'DOMAIN,generativelanguage.googleapis.com,US Transit',
              'DOMAIN,makersuite.google.com,US Transit',
          ]
          stun_domains = {
              'stun.l.google.com','stun1.l.google.com','stun2.l.google.com','stun3.l.google.com','stun4.l.google.com','stun.cloudflare.com'
          }
          new_rules = []
          inserted_ai = False
          for r in mobile.get('rules') or []:
              if not isinstance(r, str):
                  new_rules.append(r); continue
              if r.startswith(('DOMAIN,aistudio.google.com,','DOMAIN,gemini.google.com,','DOMAIN,ai.google.dev,','DOMAIN,generativelanguage.googleapis.com,','DOMAIN-SUFFIX,generativelanguage.googleapis.com,','DOMAIN,makersuite.google.com,','DOMAIN-SUFFIX,makersuite.google.com,','GEOSITE,GOOGLE,')):
                  continue
              if not inserted_ai:
                  new_rules.extend(precise_ai)
                  inserted_ai = True
              if any(r.startswith(f'DOMAIN,{d},') for d in stun_domains):
                  r = r.rsplit(',',1)[0] + ',US Transit'
              elif r.startswith('DOMAIN-SUFFIX,stun.twilio.com,'):
                  r = 'DOMAIN-SUFFIX,stun.twilio.com,US Transit'
              elif r.startswith(('DST-PORT,3478,','DST-PORT,5349,','DST-PORT,19302,')):
                  r = r.rsplit(',',1)[0] + ',US Transit'
              elif 'PROCESS-NAME-REGEX' in r and ',US UDP' in r:
                  r = r.replace(',US UDP', ',US Transit')
              elif r == 'NETWORK,UDP,US UDP':
                  r = 'NETWORK,UDP,US Transit'
              new_rules.append(r)
          if not inserted_ai:
              new_rules = precise_ai + new_rules
          mobile['rules'] = new_rules
          mobile_path.write_text(yaml.safe_dump(mobile, allow_unicode=True, sort_keys=False, width=100000), encoding='utf-8')

          wf = Path('.github/workflows/create-clash-desktop-compatible.yml')
          s = wf.read_text(encoding='utf-8')
          s = s.replace("us_re = re.compile(r'(美国|美國|US|USA|United States|Los Angeles|Seattle|San Jose|Oregon|Portland|洛杉矶|洛杉磯|西雅图|西雅圖|圣何塞|聖何塞|俄勒冈|俄勒岡|波特兰|波特蘭)', re.I)\n           us_names = [name for name in all_names if us_re.search(str(name))]",
                        "selected_us = ['US-1TCP','US1-HY2','US2-HY2','US3-HY2','US5-HY2','US6-HY2']\n           us_names = [name for name in selected_us if name in all_names]")
          s = s.replace("elif name == 'US UDP':", "elif name == 'US Transit':")
          s = s.replace("US UDP group", "US Transit group")
          s = s.replace(")),(NETWORK,UDP)),US UDP'", ")),(NETWORK,UDP)),US Transit'")
          s = s.replace("US UDP nodes", "US Transit nodes")
          wf.write_text(s, encoding='utf-8')

      - name: Commit persistent routing change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml backups/clash-before-us-transit .github/workflows/create-clash-desktop-compatible.yml
          git diff --cached --quiet || git commit -m "Unify Google AI and UDP routing into US Transit"
          git push

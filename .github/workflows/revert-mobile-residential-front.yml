name: Revert mobile residential front change

on:
  push:
    paths:
      - '.github/workflows/revert-mobile-residential-front.yml'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Restore prior mobile residential chain
        shell: python
        run: |
          from pathlib import Path
          import yaml

          path=Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml')
          d=yaml.safe_load(path.read_text(encoding='utf-8-sig'))

          udp_map={
            '俄勒冈州 205.214.55.251':False,
            '亚利桑那州弗拉格斯塔夫 47.215.192.185':False,
            '纽约州纽约市 168.158.76.54':True,
          }
          for p in d.get('proxies',[]):
            if isinstance(p,dict) and p.get('name') in udp_map:
              p['dialer-proxy']='US Transit'
              p['udp']=udp_map[p['name']]
              p['ip-version']='ipv4'

          d['proxy-groups']=[g for g in d.get('proxy-groups',[]) if not (isinstance(g,dict) and g.get('name')=='住宅前置自动选择')]
          path.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=100000),encoding='utf-8')

      - name: Validate
        run: |
          python - <<'PY'
          import yaml
          p='clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
          d=yaml.safe_load(open(p,encoding='utf-8'))
          assert all(g.get('name')!='住宅前置自动选择' for g in d['proxy-groups'])
          expected={'俄勒冈州 205.214.55.251':False,'亚利桑那州弗拉格斯塔夫 47.215.192.185':False,'纽约州纽约市 168.158.76.54':True}
          for pxy in d['proxies']:
            if pxy.get('name') in expected:
              assert pxy.get('dialer-proxy')=='US Transit'
              assert pxy.get('udp') is expected[pxy['name']]
          print('revert validated')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml
          git diff --cached --quiet || git commit -m "Revert mobile residential front change"
          git push

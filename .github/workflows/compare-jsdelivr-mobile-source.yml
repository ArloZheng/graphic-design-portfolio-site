name: Compare jsDelivr mobile with source

on:
  push:
    paths:
      - '.github/workflows/compare-jsdelivr-mobile-source.yml'

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Fetch exact jsDelivr URL
        run: |
          curl -fsSL --retry 5 --retry-delay 3 \
            'https://cdn.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' \
            -o /tmp/mobile-cdn.yaml
      - name: Compare parsed YAML
        shell: python
        run: |
          import yaml, hashlib
          from pathlib import Path
          src=Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml')
          cdn=Path('/tmp/mobile-cdn.yaml')
          s=yaml.safe_load(src.read_text(encoding='utf-8-sig'))
          c=yaml.safe_load(cdn.read_text(encoding='utf-8-sig'))
          identical=(s==c)
          sg=next(g for g in s['proxy-groups'] if g.get('name')=='Final Exit')
          cg=next(g for g in c['proxy-groups'] if g.get('name')=='Final Exit')
          text=(
            'parsed_yaml_identical='+str(identical).lower()+'\n'
            'source_final='+' | '.join(sg.get('proxies',[]))+'\n'
            'cdn_final='+' | '.join(cg.get('proxies',[]))+'\n'
          )
          Path('clash/HApiBDgfuXsS4TD7YnASWlId/jsdelivr-mobile-source-compare.txt').write_text(text,encoding='utf-8')
          print(text)
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/jsdelivr-mobile-source-compare.txt
          git diff --cached --quiet || git commit -m "Compare jsDelivr mobile profile with source"
          git push

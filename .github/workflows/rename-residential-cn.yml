name: Rename residential proxies in Chinese

on:
  push:
    paths:
      - '.github/workflows/rename-residential-cn.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Rename residential proxy labels
        shell: python
        run: |
          from pathlib import Path
          import yaml

          root=Path('clash/HApiBDgfuXsS4TD7YnASWlId')
          rename={
            'Nettleton MS 45.62.175.121':'密西西比州内特尔顿 45.62.175.121',
            'Oregon 205.214.55.251':'俄勒冈州 205.214.55.251',
            'Flagstaff AZ 47.215.192.185':'亚利桑那州弗拉格斯塔夫 47.215.192.185'
          }

          for fn in ['mobile.yaml','desktop.yaml']:
              path=root/fn
              d=yaml.safe_load(path.read_text(encoding='utf-8-sig'))
              for p in d.get('proxies',[]):
                  if isinstance(p,dict) and p.get('name') in rename:
                      p['name']=rename[p['name']]
              for g in d.get('proxy-groups',[]):
                  if isinstance(g,dict) and isinstance(g.get('proxies'),list):
                      g['proxies']=[rename.get(x,x) for x in g['proxies']]
              path.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=100000),encoding='utf-8')

      - name: Validate
        run: |
          python - <<'PY'
          import yaml
          expected=['密西西比州内特尔顿 45.62.175.121','俄勒冈州 205.214.55.251','亚利桑那州弗拉格斯塔夫 47.215.192.185']
          for fn in ['mobile.yaml','desktop.yaml']:
              p='clash/HApiBDgfuXsS4TD7YnASWlId/'+fn
              d=yaml.safe_load(open(p,encoding='utf-8'))
              names=[x.get('name') for x in d.get('proxies',[]) if isinstance(x,dict)]
              for name in expected:
                  assert name in names
              final=next(g for g in d['proxy-groups'] if g['name']=='Final Exit')
              assert final['proxies']==expected
          print('Chinese residential labels validated')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml
          git diff --cached --quiet || git commit -m "Rename residential proxy labels in Chinese"
          git push

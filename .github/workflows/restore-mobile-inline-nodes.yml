name: Restore mobile inline nodes

on:
  push:
    paths:
      - '.github/workflows/restore-mobile-inline-nodes.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet pyyaml
      - name: Restore known-working inline mobile config and keep current routing
        shell: python
        run: |
          from pathlib import Path
          import subprocess, yaml

          target = Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml')
          raw = subprocess.check_output([
              'git','show','d73b2c45c5ac199a14aeafadd819cac2bbb6fdbb:clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
          ], text=True)
          doc = yaml.safe_load(raw)

          # Keep the new fixed residential endpoint while preserving the chain.
          residential = next(p for p in doc['proxies'] if p.get('name') == 'Oregon Residential')
          residential['server'] = '205.214.55.251'
          residential['dialer-proxy'] = 'Airport Front'
          residential['udp'] = False

          # Keep only one US Transit group and the original Final Exit chain.
          groups = []
          added = False
          selected = ['US-1TCP','US1-HY2','US2-HY2','US3-HY2','US5-HY2','US6-HY2']
          for g in doc.get('proxy-groups', []):
              name = g.get('name') if isinstance(g, dict) else None
              if name in {'US UDP','Google AI','US Transit'}:
                  if not added:
                      groups.append({'name':'US Transit','type':'select','proxies':selected})
                      added = True
                  continue
              groups.append(g)
          doc['proxy-groups'] = groups

          # Empty Google AI whitelist: former Google AI domains fall through to Final Exit.
          removed_domains = {
              'aistudio.google.com','gemini.google.com','ai.google.dev',
              'generativelanguage.googleapis.com','makersuite.google.com',
              'alkalimakersuite-pa.clients6.google.com','accounts.google.com',
              'oauth2.googleapis.com','people.googleapis.com',
              'identitytoolkit.googleapis.com','securetoken.googleapis.com',
              'firebaseinstallations.googleapis.com'
          }

          rules = []
          for r in doc.get('rules', []):
              if not isinstance(r, str):
                  rules.append(r); continue
              if r.startswith('DOMAIN,'):
                  parts = r.split(',')
                  if len(parts) >= 3 and parts[1] in removed_domains:
                      continue
              if r.startswith('GEOSITE,GOOGLE,'):
                  continue
              r = r.replace(',US UDP', ',US Transit').replace(',Google AI', ',US Transit')
              rules.append(r)

          # Ensure Google QUIC is rejected so Google TCP falls through to Final Exit.
          quic = [
              'AND,((DOMAIN-SUFFIX,google.com),(NETWORK,UDP),(DST-PORT,443)),REJECT',
              'AND,((DOMAIN-SUFFIX,googleapis.com),(NETWORK,UDP),(DST-PORT,443)),REJECT',
              'AND,((DOMAIN-SUFFIX,gstatic.com),(NETWORK,UDP),(DST-PORT,443)),REJECT',
              'AND,((DOMAIN-SUFFIX,googleusercontent.com),(NETWORK,UDP),(DST-PORT,443)),REJECT',
          ]
          for q in quic:
              if q in rules:
                  rules.remove(q)
          insert_at = next((i for i,r in enumerate(rules) if isinstance(r,str) and ('PROCESS-NAME-REGEX' in r or r.startswith('GEOSITE,CN,') or r == 'NETWORK,UDP,US Transit')), len(rules))
          rules[insert_at:insert_at] = quic
          doc['rules'] = rules

          target.write_text(yaml.safe_dump(doc, allow_unicode=True, sort_keys=False, width=100000), encoding='utf-8')

      - name: Validate self-contained mobile config
        run: |
          python - <<'PY'
          import yaml
          p='clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
          d=yaml.safe_load(open(p,encoding='utf-8'))
          assert not d.get('proxy-providers')
          proxy_names={x.get('name') for x in d.get('proxies',[]) if isinstance(x,dict)}
          for n in ['US-1TCP','US1-HY2','US2-HY2','US3-HY2','US5-HY2','US6-HY2','Oregon Residential']:
              assert n in proxy_names, n
          groups={g.get('name'):g for g in d.get('proxy-groups',[]) if isinstance(g,dict)}
          assert 'Airport Front' in groups
          assert groups['US Transit']['proxies'] == ['US-1TCP','US1-HY2','US2-HY2','US3-HY2','US5-HY2','US6-HY2']
          assert groups['Final Exit']['proxies'] == ['Oregon Residential']
          residential=next(x for x in d['proxies'] if x.get('name')=='Oregon Residential')
          assert residential['server']=='205.214.55.251'
          assert residential['dialer-proxy']=='Airport Front'
          assert d['rules'][-1]=='MATCH,Final Exit'
          print('self-contained mobile config validation passed')
          PY

      - name: Commit restored mobile config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml
          git diff --cached --quiet || git commit -m "Restore self-contained mobile inline-node config"
          git push

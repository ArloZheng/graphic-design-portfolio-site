name: Fix mobile airport HTTP provider

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-airport-http-provider.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Convert local file provider to HTTP provider
        shell: python
        run: |
          from pathlib import Path
          import yaml
          p=Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml')
          d=yaml.safe_load(p.read_text(encoding='utf-8-sig'))
          d['proxy-providers']['airport']={
            'type':'http',
            'url':'https://raw.githubusercontent.com/ArloZheng/graphic-design-portfolio-site/main/clash/HApiBDgfuXsS4TD7YnASWlId/airport.yaml',
            'interval':3600,
            'path':'./proxy_provider/airport.yaml',
            'health-check':{
              'enable':True,
              'url':'https://www.gstatic.com/generate_204',
              'interval':600
            }
          }
          p.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=100000),encoding='utf-8')
      - name: Validate
        run: |
          python - <<'PY'
          import yaml
          d=yaml.safe_load(open('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml',encoding='utf-8'))
          p=d['proxy-providers']['airport']
          assert p['type']=='http'
          assert p['url'].endswith('/airport.yaml')
          assert d['proxy-groups'][0]['use']==['airport']
          assert d['rules'][-1]=='MATCH,Final Exit'
          print('mobile provider validation passed')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml
          git diff --cached --quiet || git commit -m "Fix mobile airport HTTP provider"
          git push

name: Fix mobile residential latency

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-residential-latency.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Restore mobile residential dialer chain
        shell: python
        run: |
          from pathlib import Path
          import yaml

          p=Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml')
          d=yaml.safe_load(p.read_text(encoding='utf-8-sig'))

          residential=next(x for x in d.get('proxies',[]) if x.get('name')=='Oregon Residential')
          residential['dialer-proxy']='Airport Front'

          # Keep all existing mobile nodes, groups and rules unchanged.
          p.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=100000),encoding='utf-8')

      - name: Validate mobile only
        run: |
          python - <<'PY'
          import yaml
          p='clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
          d=yaml.safe_load(open(p,encoding='utf-8'))
          r=next(x for x in d['proxies'] if x.get('name')=='Oregon Residential')
          assert r['dialer-proxy']=='Airport Front'
          groups={g['name']:g for g in d['proxy-groups']}
          assert 'Airport Front' in groups
          assert 'Final Exit' in groups
          assert d['rules'][-1]=='MATCH,Final Exit'
          print('mobile residential chain restored')
          PY

      - name: Commit mobile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml
          git diff --cached --quiet || git commit -m "Restore mobile residential dialer chain"
          git push

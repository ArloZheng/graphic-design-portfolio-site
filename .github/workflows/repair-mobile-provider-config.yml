name: Repair mobile provider config

on:
  push:
    paths:
      - '.github/workflows/repair-mobile-provider-config.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet pyyaml
      - name: Restore compact provider-based mobile config and apply current routing
        shell: python
        run: |
          from pathlib import Path
          import subprocess, yaml

          path = Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml')
          old = subprocess.check_output([
              'git','show','eb25854a520c0b9d130a918bc91b00af86706a7d:clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
          ], text=True)
          doc = yaml.safe_load(old)

          residential = next(p for p in doc['proxies'] if p.get('name') == 'Oregon Residential')
          residential['server'] = '205.214.55.251'
          residential['dialer-proxy'] = 'Airport Front'

          groups = []
          for g in doc.get('proxy-groups', []):
              if g.get('name') in {'US UDP','Google AI','US Transit'}:
                  continue
              groups.append(g)
          insert_at = next((i+1 for i,g in enumerate(groups) if g.get('name') == 'Airport Front'), len(groups))
          groups.insert(insert_at, {
              'name': 'US Transit',
              'type': 'select',
              'use': ['airport'],
              'filter': '^(?:US-1TCP|US1-HY2|US2-HY2|US3-HY2|US5-HY2|US6-HY2)$'
          })
          doc['proxy-groups'] = groups

          doc['rules'] = [
              'AND,((DOMAIN-SUFFIX,chatgpt.com),(NETWORK,UDP),(DST-PORT,443)),REJECT',
              'AND,((DOMAIN-SUFFIX,openai.com),(NETWORK,UDP),(DST-PORT,443)),REJECT',
              'AND,((DOMAIN-SUFFIX,oaistatic.com),(NETWORK,UDP),(DST-PORT,443)),REJECT',
              'AND,((DOMAIN-SUFFIX,oaiusercontent.com),(NETWORK,UDP),(DST-PORT,443)),REJECT',
              'DOMAIN-SUFFIX,chatgpt.com,Final Exit',
              'DOMAIN-SUFFIX,openai.com,Final Exit',
              'DOMAIN-SUFFIX,oaistatic.com,Final Exit',
              'DOMAIN-SUFFIX,oaiusercontent.com,Final Exit',
              'DOMAIN,stun.l.google.com,US Transit',
              'DOMAIN,stun1.l.google.com,US Transit',
              'DOMAIN,stun2.l.google.com,US Transit',
              'DOMAIN,stun3.l.google.com,US Transit',
              'DOMAIN,stun4.l.google.com,US Transit',
              'DOMAIN,stun.cloudflare.com,US Transit',
              'DOMAIN-SUFFIX,stun.twilio.com,US Transit',
              'DST-PORT,3478,US Transit',
              'DST-PORT,5349,US Transit',
              'DST-PORT,19302,US Transit',
              'AND,((PROCESS-NAME-REGEX,(?i)(com\\.android\\.chrome|com\\.huawei\\.browser|com\\.microsoft\\.emmx|org\\.mozilla\\.firefox|com\\.brave\\.browser|com\\.opera\\..*|com\\.kiwibrowser\\.browser|com\\.vivaldi\\.browser|com\\.google\\.android\\.webview|com\\.android\\.webview|com\\.huawei\\.webview|com\\.openai\\.chatgpt|com\\.google\\.android\\.googlequicksearchbox)),(NETWORK,UDP)),US Transit',
              'GEOSITE,CN,DIRECT',
              'GEOIP,CN,DIRECT,no-resolve',
              'NETWORK,UDP,US Transit',
              'MATCH,Final Exit'
          ]

          path.write_text(yaml.safe_dump(doc, allow_unicode=True, sort_keys=False, width=100000), encoding='utf-8')

      - name: Validate compact mobile config
        run: |
          python - <<'PY'
          import yaml
          p='clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
          d=yaml.safe_load(open(p,encoding='utf-8'))
          assert 'airport' in d.get('proxy-providers',{})
          names=[g.get('name') for g in d.get('proxy-groups',[])]
          assert names==['Airport Front','US Transit','Final Exit']
          assert d['rules'][-1]=='MATCH,Final Exit'
          r=next(x for x in d['proxies'] if x.get('name')=='Oregon Residential')
          assert r['server']=='205.214.55.251'
          assert r['dialer-proxy']=='Airport Front'
          print('mobile config validation passed')
          PY

      - name: Commit repaired mobile config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml
          git diff --cached --quiet || git commit -m "Repair compact provider-based mobile config"
          git push

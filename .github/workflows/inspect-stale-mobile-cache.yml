name: Inspect stale mobile cache

on:
  push:
    paths:
      - '.github/workflows/inspect-stale-mobile-cache.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Fetch exact fixed mobile URL
        run: |
          curl -fsSL --retry 5 --retry-delay 3 'https://cdn.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' -o /tmp/mobile.yaml
      - name: Summarize stale config
        shell: python
        run: |
          import yaml
          from pathlib import Path
          d=yaml.safe_load(Path('/tmp/mobile.yaml').read_text(encoding='utf-8-sig'))
          lines=[]
          lines.append('PROXY_NAMES')
          for p in d.get('proxies',[]):
              lines.append('- '+str(p.get('name')))
          lines.append('\nGROUPS')
          for g in d.get('proxy-groups',[]):
              lines.append(f"- {g.get('name')} type={g.get('type')} proxies={g.get('proxies')} use={g.get('use')} include_all={g.get('include-all-proxies')}")
          lines.append('\nPROVIDERS')
          for k,v in (d.get('proxy-providers') or {}).items():
              lines.append(f"- {k}: {v.get('url')}")
          Path('clash/HApiBDgfuXsS4TD7YnASWlId/stale-mobile-cache-summary.txt').write_text('\n'.join(lines),encoding='utf-8')
      - name: Commit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/stale-mobile-cache-summary.txt
          git diff --cached --quiet || git commit -m "Record stale mobile CDN config structure"
          git push

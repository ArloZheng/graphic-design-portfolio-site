name: Add one mobile residential node

on:
  push:
    paths:
      - '.github/workflows/add-mobile-residential-node.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml

      - name: Append only one residential node and one Final Exit reference
        shell: python
        run: |
          from pathlib import Path
          import copy, yaml

          p=Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml')
          d=yaml.safe_load(p.read_text(encoding='utf-8-sig'))
          before=copy.deepcopy(d)

          node_name='Residential 198.65.47.221'
          assert not any(x.get('name')==node_name for x in d.get('proxies',[]))
          assert not any(x.get('server')=='198.65.47.221' for x in d.get('proxies',[]))

          new_node={
            'name': node_name,
            'type': 'socks5',
            'server': '198.65.47.221',
            'port': 7471,
            'username': '9x20rcFkf6WE',
            'password': 'ZZxkwowX62ty',
            'udp': False,
            'dialer-proxy': 'Airport Front',
            'ip-version': 'ipv4',
          }
          d['proxies'].append(new_node)

          final=next(g for g in d['proxy-groups'] if g.get('name')=='Final Exit')
          assert node_name not in final.get('proxies',[])
          final['proxies'].append(node_name)

          # Strictly verify that nothing else changed.
          for key in before:
            if key not in ('proxies','proxy-groups'):
              assert d[key]==before[key], key

          assert d['proxies'][:-1]==before['proxies']
          assert d['proxies'][-1]==new_node

          bg={g['name']:g for g in before['proxy-groups']}
          ag={g['name']:g for g in d['proxy-groups']}
          for name in bg:
            if name!='Final Exit':
              assert ag[name]==bg[name], name

          old_final=copy.deepcopy(bg['Final Exit'])
          new_final=copy.deepcopy(ag['Final Exit'])
          old_members=old_final.pop('proxies')
          new_members=new_final.pop('proxies')
          assert old_final==new_final
          assert new_members==old_members+[node_name]

          p.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=100000),encoding='utf-8')

      - name: Validate exact node addition
        run: |
          python - <<'PY'
          import yaml
          p='clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
          d=yaml.safe_load(open(p,encoding='utf-8'))
          name='Residential 198.65.47.221'
          n=next(x for x in d['proxies'] if x.get('name')==name)
          assert n['server']=='198.65.47.221'
          assert n['port']==7471
          assert n['type']=='socks5'
          assert n['dialer-proxy']=='Airport Front'
          g=next(x for x in d['proxy-groups'] if x.get('name')=='Final Exit')
          assert g['proxies'][-1]==name
          print('single mobile node addition validated')
          PY

      - name: Commit mobile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml
          git diff --cached --quiet || git commit -m "Add residential node 198.65.47.221 to mobile"
          git push

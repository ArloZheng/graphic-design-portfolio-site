name: Verify mobile Final Exit CDN

on:
  push:
    paths:
      - '.github/workflows/verify-mobile-node-cdn.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Purge mobile CDN aliases
        run: |
          set -e
          curl -fsSL --retry 5 --retry-delay 2 \
            'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' \
            -o /tmp/purge-file-main.json
          curl -fsSL --retry 5 --retry-delay 2 \
            'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' \
            -o /tmp/purge-file-latest.json
          curl -fsSL --retry 5 --retry-delay 2 \
            'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/' \
            -o /tmp/purge-repo-main.json
          cat /tmp/purge-file-main.json
          cat /tmp/purge-file-latest.json
          cat /tmp/purge-repo-main.json
      - name: Poll exact mobile CDN URL and record Final Exit
        shell: python
        run: |
          import time, subprocess, yaml
          from pathlib import Path

          url='https://cdn.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
          expected=[
            '亚利桑那州弗拉格斯塔夫 47.215.192.185',
            '纽约州纽约市 168.158.76.54',
            'Residential 198.65.47.221',
          ]
          verified=False
          members=[]
          attempts=0
          for i in range(18):
            attempts=i+1
            subprocess.run(['curl','-fsSL','--retry','3','--retry-delay','2',url,'-o','/tmp/mobile.yaml'],check=True)
            d=yaml.safe_load(Path('/tmp/mobile.yaml').read_text(encoding='utf-8-sig'))
            final=next(g for g in d['proxy-groups'] if g.get('name')=='Final Exit')
            members=final.get('proxies',[])
            verified=(members==expected)
            print(f'attempt={attempts} verified={verified} members={members}')
            if verified:
              break
            time.sleep(10)
          text=(
            'verified='+str(verified).lower()+'\n'
            +'attempts='+str(attempts)+'\n'
            +'members:\n'
            +''.join('- '+x+'\n' for x in members)
          )
          Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile-final-exit-cdn-observed.txt').write_text(text,encoding='utf-8')
          print(text)
      - name: Commit observed CDN result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile-final-exit-cdn-observed.txt
          git diff --cached --quiet || git commit -m "Record actual mobile CDN Final Exit members"
          git push

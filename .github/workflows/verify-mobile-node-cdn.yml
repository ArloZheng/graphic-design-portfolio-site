name: Verify mobile Final Exit CDN

on:
  push:
    paths:
      - '.github/workflows/verify-mobile-node-cdn.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Purge mobile CDN directories
        run: |
          set +e
          curl -sS 'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/' -o /tmp/purge-dir-main.json
          curl -sS 'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site/clash/HApiBDgfuXsS4TD7YnASWlId/' -o /tmp/purge-dir-latest.json
          sleep 15
          curl -fsSL --retry 5 --retry-delay 3 'https://cdn.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' -o /tmp/mobile.yaml
      - name: Record observed Final Exit and purge responses
        shell: python
        run: |
          import yaml
          from pathlib import Path
          d=yaml.safe_load(Path('/tmp/mobile.yaml').read_text(encoding='utf-8-sig'))
          final=next(g for g in d['proxy-groups'] if g.get('name')=='Final Exit')
          text=(
            'PURGE_DIR_MAIN\n'+Path('/tmp/purge-dir-main.json').read_text(errors='replace')+'\n\n'
            +'PURGE_DIR_LATEST\n'+Path('/tmp/purge-dir-latest.json').read_text(errors='replace')+'\n\n'
            +'FINAL_EXIT_MEMBERS\n'+''.join('- '+x+'\n' for x in final.get('proxies',[]))
          )
          Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile-directory-purge-observed.txt').write_text(text,encoding='utf-8')
          print(text)
      - name: Commit observed result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile-directory-purge-observed.txt
          git diff --cached --quiet || git commit -m "Record directory purge mobile CDN result"
          git push

name: Verify mobile node on CDN

on:
  push:
    paths:
      - '.github/workflows/verify-mobile-node-cdn.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Purge exact mobile CDN URL
        run: |
          curl -fsSL --retry 5 --retry-delay 2 \
            'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' \
            -o /tmp/purge.json
          cat /tmp/purge.json
      - name: Fetch exact mobile CDN URL and record new node presence
        run: |
          sleep 20
          curl -fsSL --retry 5 --retry-delay 3 \
            'https://cdn.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' \
            -o /tmp/mobile.yaml
          python - <<'PY'
          import yaml
          from pathlib import Path
          d=yaml.safe_load(open('/tmp/mobile.yaml',encoding='utf-8-sig'))
          name='Residential 198.65.47.221'
          node=next((x for x in d.get('proxies',[]) if x.get('name')==name),None)
          g=next(x for x in d['proxy-groups'] if x.get('name')=='Final Exit')
          present=(node is not None and node.get('server')=='198.65.47.221' and node.get('port')==7471 and name in g.get('proxies',[]))
          text='verified='+str(present).lower()+'\nname='+name+'\nfinal_exit_member='+str(name in g.get('proxies',[])).lower()+'\n'
          Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile-node-cdn-observed.txt').write_text(text,encoding='utf-8')
          print(text)
          PY
      - name: Commit observed CDN result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile-node-cdn-observed.txt
          git diff --cached --quiet || git commit -m "Record new mobile node CDN state"
          git push

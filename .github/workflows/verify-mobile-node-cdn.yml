name: Verify mobile node on CDN

on:
  push:
    paths:
      - '.github/workflows/verify-mobile-node-cdn.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Purge mobile CDN aliases
        run: |
          set -e
          curl -fsSL --retry 5 --retry-delay 2 \
            'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' \
            -o /tmp/purge-file-main.json
          curl -fsSL --retry 5 --retry-delay 2 \
            'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' \
            -o /tmp/purge-file-latest.json
          curl -fsSL --retry 5 --retry-delay 2 \
            'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/' \
            -o /tmp/purge-repo-main.json
          cat /tmp/purge-file-main.json
          cat /tmp/purge-file-latest.json
          cat /tmp/purge-repo-main.json
      - name: Poll exact mobile CDN URL for the new node
        shell: python
        run: |
          import subprocess,time,yaml
          from pathlib import Path
          url='https://cdn.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
          name='Residential 198.65.47.221'
          present=False
          final_member=False
          attempts=0
          for i in range(18):
            attempts=i+1
            subprocess.run(['curl','-fsSL','--retry','3','--retry-delay','2',url,'-o','/tmp/mobile.yaml'],check=True)
            d=yaml.safe_load(Path('/tmp/mobile.yaml').read_text(encoding='utf-8-sig'))
            node=next((x for x in d.get('proxies',[]) if x.get('name')==name),None)
            g=next(x for x in d['proxy-groups'] if x.get('name')=='Final Exit')
            final_member=name in g.get('proxies',[])
            present=(node is not None and node.get('server')=='198.65.47.221' and node.get('port')==7471 and final_member)
            print(f'attempt={attempts} verified={present} final_member={final_member}')
            if present:
              break
            time.sleep(10)
          text=('verified='+str(present).lower()+'\nname='+name+'\nfinal_exit_member='+str(final_member).lower()+'\nattempts='+str(attempts)+'\n')
          Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile-node-cdn-observed.txt').write_text(text,encoding='utf-8')
          print(text)
      - name: Commit observed CDN result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile-node-cdn-observed.txt
          git diff --cached --quiet || git commit -m "Record new mobile node CDN state"
          git push

name: Verify mobile Final Exit CDN

on:
  push:
    paths:
      - '.github/workflows/verify-mobile-node-cdn.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Purge mobile CDN aliases and capture responses
        run: |
          set +e
          curl -sS -w '\nHTTP_STATUS:%{http_code}\n' \
            'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' \
            -o /tmp/purge-file-main.json
          echo '\nHTTP_STATUS:'$(curl -sS -o /dev/null -w '%{http_code}' \
            'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml') >> /tmp/purge-file-main.json
          curl -sS \
            'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' \
            -o /tmp/purge-file-latest.json
          curl -sS \
            'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/' \
            -o /tmp/purge-repo-main.json
          curl -fsSL \
            'https://cdn.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' \
            -o /tmp/mobile.yaml
      - name: Record purge responses and CDN Final Exit
        shell: python
        run: |
          import yaml
          from pathlib import Path
          d=yaml.safe_load(Path('/tmp/mobile.yaml').read_text(encoding='utf-8-sig'))
          final=next(g for g in d['proxy-groups'] if g.get('name')=='Final Exit')
          parts=[]
          for title,p in [
            ('PURGE_FILE_MAIN','/tmp/purge-file-main.json'),
            ('PURGE_FILE_LATEST','/tmp/purge-file-latest.json'),
            ('PURGE_REPO_MAIN','/tmp/purge-repo-main.json'),
          ]:
            parts.append(title+'\n'+Path(p).read_text(errors='replace')+'\n')
          parts.append('FINAL_EXIT_MEMBERS\n'+''.join('- '+x+'\n' for x in final.get('proxies',[])))
          Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile-cdn-purge-debug.txt').write_text('\n'.join(parts),encoding='utf-8')
      - name: Commit debug result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile-cdn-purge-debug.txt
          git diff --cached --quiet || git commit -m "Record jsDelivr purge responses for mobile config"
          git push

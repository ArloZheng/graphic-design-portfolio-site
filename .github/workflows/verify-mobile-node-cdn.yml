name: Verify mobile node on CDN

on:
  push:
    paths:
      - '.github/workflows/verify-mobile-node-cdn.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Purge exact mobile CDN URL
        run: |
          curl -fsSL --retry 5 --retry-delay 2 \
            'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' \
            -o /tmp/purge.json
          cat /tmp/purge.json
      - name: Fetch exact mobile CDN URL and verify new node
        run: |
          sleep 20
          curl -fsSL --retry 5 --retry-delay 3 \
            'https://cdn.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' \
            -o /tmp/mobile.yaml
          python - <<'PY'
          import yaml
          from pathlib import Path
          d=yaml.safe_load(open('/tmp/mobile.yaml',encoding='utf-8-sig'))
          name='Residential 198.65.47.221'
          n=next(x for x in d['proxies'] if x.get('name')==name)
          assert n['server']=='198.65.47.221'
          assert n['port']==7471
          assert n['type']=='socks5'
          assert n['dialer-proxy']=='Airport Front'
          g=next(x for x in d['proxy-groups'] if x.get('name')=='Final Exit')
          assert name in g['proxies']
          Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile-node-cdn-verified.txt').write_text(
            'verified=true\nname='+name+'\nserver=198.65.47.221\nport=7471\nfinal_exit_member=true\n',encoding='utf-8')
          print('exact CDN URL contains the new node')
          PY
      - name: Commit verification result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile-node-cdn-verified.txt
          git diff --cached --quiet || git commit -m "Verify new mobile residential node on CDN"
          git push

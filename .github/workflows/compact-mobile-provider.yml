name: Compact mobile provider config

on:
  push:
    paths:
      - '.github/workflows/compact-mobile-provider.yml'

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Split nodes into provider and keep mobile yaml small
        shell: python
        run: |
          from pathlib import Path
          import yaml

          root=Path('clash/HApiBDgfuXsS4TD7YnASWlId')
          mobile=root/'mobile.yaml'
          doc=yaml.safe_load(mobile.read_text(encoding='utf-8-sig'))

          proxies=doc.get('proxies',[])
          airport=[p for p in proxies if isinstance(p,dict) and p.get('name')!='Oregon Residential']
          residential=[p for p in proxies if isinstance(p,dict) and p.get('name')=='Oregon Residential']

          provider={
            'proxies': airport
          }
          (root/'airport.yaml').write_text(yaml.safe_dump(provider,allow_unicode=True,sort_keys=False,width=100000),encoding='utf-8')

          doc['proxies']=residential
          doc['proxy-providers']={
            'airport':{
              'type':'file',
              'path':'./airport.yaml'
            }
          }

          for g in doc.get('proxy-groups',[]):
            if g.get('name')=='Airport Front':
              g.clear(); g.update({'name':'Airport Front','type':'select','use':['airport']})
            elif g.get('name')=='US Transit':
              g.clear(); g.update({'name':'US Transit','type':'select','use':['airport'],'filter':'^(?:US-1TCP|US1-HY2|US2-HY2|US3-HY2|US5-HY2|US6-HY2)$'})

          mobile.write_text(yaml.safe_dump(doc,allow_unicode=True,sort_keys=False,width=100000),encoding='utf-8')

      - name: Validate compact config
        run: |
          python - <<'PY'
          import yaml
          d=yaml.safe_load(open('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml',encoding='utf-8'))
          assert d.get('proxy-providers')
          assert len(d.get('proxies',[]))==1
          print('compact mobile config ok')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml clash/HApiBDgfuXsS4TD7YnASWlId/airport.yaml
          git diff --cached --quiet || git commit -m "Compact mobile config with airport provider"
          git push

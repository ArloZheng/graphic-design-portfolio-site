name: Verify fixed URLs after removing Arizona exit

on:
  push:
    paths:
      - '.github/workflows/verify-three-exit-fixed-urls.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Purge desktop CDN and fetch fixed URLs
        shell: bash
        run: |
          set +e
          curl -sS 'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml' -o /tmp/purge-desktop.json
          sleep 20
          curl -L --max-time 30 -sS -w '%{http_code}' -o /tmp/mobile-pages.yaml 'https://arlozheng.github.io/graphic-design-portfolio-site/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' > /tmp/mobile-pages.code
          curl -L --max-time 30 -sS -w '%{http_code}' -o /tmp/desktop-jsd.yaml 'https://cdn.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml' > /tmp/desktop-jsd.code
      - name: Validate fixed URL responses
        shell: python
        run: |
          import yaml
          from pathlib import Path
          expected_set={
            '美国俄勒冈州 205.214.55.251',
            '美国纽约市 168.158.76.54',
            '美国 198.65.47.221',
          }
          out=[]
          for label,path,codepath in [
            ('MOBILE_PAGES','/tmp/mobile-pages.yaml','/tmp/mobile-pages.code'),
            ('DESKTOP_JSDELIVR','/tmp/desktop-jsd.yaml','/tmp/desktop-jsd.code'),
          ]:
            code=Path(codepath).read_text().strip()
            ok=False
            members=[]
            err=''
            try:
              d=yaml.safe_load(Path(path).read_text(encoding='utf-8-sig'))
              final=next(g for g in d['proxy-groups'] if g.get('name')=='Final Exit')
              members=final.get('proxies',[])
              ok=(set(members)==expected_set and len(members)==3)
            except Exception as e:
              err=repr(e)
            out.append(f'{label}_HTTP={code}\n{label}_VERIFIED={str(ok).lower()}\n{label}_ERROR={err}\n'+''.join('- '+x+'\n' for x in members))
          out.append('PURGE_DESKTOP\n'+Path('/tmp/purge-desktop.json').read_text(errors='replace'))
          Path('clash/HApiBDgfuXsS4TD7YnASWlId/three-exit-fixed-url-verify.txt').write_text('\n\n'.join(out),encoding='utf-8')
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/three-exit-fixed-url-verify.txt
          git diff --cached --quiet || git commit -m "Record three-exit fixed URL verification"
          git push

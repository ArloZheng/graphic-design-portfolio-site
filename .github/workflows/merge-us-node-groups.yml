name: Merge compact US node groups

on:
  push:
    paths:
      - '.github/workflows/merge-us-node-groups.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Patch mobile and desktop configs
        shell: python
        run: |
          from pathlib import Path
          import yaml

          selected = [
              'US-1TCP',
              'US1-HY2',
              'US2-HY2',
              'US3-HY2',
              'US5-HY2',
              'US6-HY2',
          ]
          exact_filter = '^(?:' + '|'.join(selected) + ')$'

          mobile_path = Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml')
          mobile = yaml.safe_load(mobile_path.read_text(encoding='utf-8-sig'))
          for group in mobile.get('proxy-groups', []):
              if group.get('name') in {'US UDP', 'Google AI'}:
                  group['type'] = 'select'
                  group['use'] = ['airport']
                  group['filter'] = exact_filter
                  group.pop('proxies', None)
          mobile_path.write_text(yaml.safe_dump(mobile, allow_unicode=True, sort_keys=False), encoding='utf-8')

          desktop_path = Path('clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml')
          desktop = yaml.safe_load(desktop_path.read_text(encoding='utf-8-sig'))
          for group in desktop.get('proxy-groups', []):
              if group.get('name') in {'US UDP', 'Google AI'}:
                  group['type'] = 'select'
                  group['proxies'] = selected
                  group.pop('use', None)
                  group.pop('filter', None)
          desktop_path.write_text(yaml.safe_dump(desktop, allow_unicode=True, sort_keys=False), encoding='utf-8')

      - name: Commit compact node groups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml
          git diff --cached --quiet || git commit -m "Merge Google AI and US UDP node lists into compact US set"
          git push

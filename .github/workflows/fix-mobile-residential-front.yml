name: Fix mobile residential front chain

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-residential-front.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Add auto-tested residential front group for mobile
        shell: python
        run: |
          from pathlib import Path
          import yaml

          path=Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml')
          d=yaml.safe_load(path.read_text(encoding='utf-8-sig'))

          residential_names={
            '纽约州纽约市 168.158.76.54',
            '俄勒冈州 205.214.55.251',
            '亚利桑那州弗拉格斯塔夫 47.215.192.185',
          }
          for p in d.get('proxies',[]):
            if isinstance(p,dict) and p.get('name') in residential_names:
              p['dialer-proxy']='住宅前置自动选择'
              p['udp']=False
              p['ip-version']='ipv4'

          groups=d.get('proxy-groups',[])
          groups=[g for g in groups if not (isinstance(g,dict) and g.get('name')=='住宅前置自动选择')]
          insert_at=0
          for i,g in enumerate(groups):
            if isinstance(g,dict) and g.get('name')=='US Transit':
              insert_at=i+1
          residential_front={
            'name':'住宅前置自动选择',
            'type':'url-test',
            'url':'http://captive.apple.com/hotspot-detect.html',
            'interval':180,
            'tolerance':100,
            'lazy':True,
            'proxies':['US-1TCP','US-2TCP','US-3TCP','US-4TCP','US-5TCP']
          }
          groups.insert(insert_at,residential_front)
          d['proxy-groups']=groups

          path.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=100000),encoding='utf-8')

      - name: Validate mobile residential front
        run: |
          python - <<'PY'
          import yaml
          p='clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
          d=yaml.safe_load(open(p,encoding='utf-8'))
          names=[g['name'] for g in d['proxy-groups']]
          assert '住宅前置自动选择' in names
          residential={'纽约州纽约市 168.158.76.54','俄勒冈州 205.214.55.251','亚利桑那州弗拉格斯塔夫 47.215.192.185'}
          for pxy in d['proxies']:
            if pxy.get('name') in residential:
              assert pxy.get('dialer-proxy')=='住宅前置自动选择'
              assert pxy.get('udp') is False
          group=next(g for g in d['proxy-groups'] if g['name']=='住宅前置自动选择')
          assert group['type']=='url-test'
          assert group['proxies']==['US-1TCP','US-2TCP','US-3TCP','US-4TCP','US-5TCP']
          print('mobile residential front validation passed')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml
          git diff --cached --quiet || git commit -m "Fix mobile residential front chain"
          git push

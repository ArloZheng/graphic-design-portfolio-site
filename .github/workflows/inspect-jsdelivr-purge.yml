name: Inspect jsDelivr purge response

on:
  push:
    paths:
      - '.github/workflows/inspect-jsdelivr-purge.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call purge endpoint
        run: |
          curl -sS -D /tmp/purge-headers.txt \
            'https://purge.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml' \
            -o /tmp/purge-body.txt
          {
            echo '---headers---'
            grep -Ei '^(HTTP/|date|content-type|server|cf-|x-)' /tmp/purge-headers.txt || true
            echo '---body---'
            cat /tmp/purge-body.txt
          } > clash/HApiBDgfuXsS4TD7YnASWlId/jsdelivr-purge-response.txt
          cat clash/HApiBDgfuXsS4TD7YnASWlId/jsdelivr-purge-response.txt
      - name: Commit response
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/jsdelivr-purge-response.txt
          git diff --cached --quiet || git commit -m "Record jsDelivr purge response"
          git push

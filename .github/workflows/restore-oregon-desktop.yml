name: Restore Oregon desktop exit

on:
  push:
    paths:
      - '.github/workflows/restore-oregon-desktop.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good desktop config
        run: |
          git show ad6d3aa0468ce5fa76bf8be9694e00e177b2dda8:clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml > clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml

      - name: Commit restored desktop config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml
          git diff --cached --quiet || git commit -m "Restore Oregon residential exit on desktop"
          git push

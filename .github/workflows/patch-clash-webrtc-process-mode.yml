name: Patch Clash WebRTC process matching

on:
  push:
    paths:
      - '.github/workflows/patch-clash-webrtc-process-mode.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Strengthen Android process matching
        shell: python
        run: |
          from pathlib import Path

          p = Path('clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml')
          s = p.read_text(encoding='utf-8')

          if 'find-process-mode:' not in s:
              s = s.replace('unified-delay: true\n', 'unified-delay: true\nfind-process-mode: always\n', 1)
          else:
              import re
              s = re.sub(r'(?m)^find-process-mode:\s*.*$', 'find-process-mode: always', s, count=1)

          old = r'''  - AND,((PROCESS-NAME-REGEX,(?i)(com\.android\.chrome|com\.huawei\.browser|com\.microsoft\.emmx|org\.mozilla\.firefox|com\.brave\.browser|com\.opera\..*|com\.kiwibrowser\.browser|com\.vivaldi\.browser)),(NETWORK,UDP)),US UDP'''

          new = r'''  - AND,((PROCESS-NAME-REGEX,(?i)(com\.android\.chrome|com\.huawei\.browser|com\.microsoft\.emmx|org\.mozilla\.firefox|com\.brave\.browser|com\.opera\..*|com\.kiwibrowser\.browser|com\.vivaldi\.browser|com\.google\.android\.webview|com\.android\.webview|com\.huawei\.webview|com\.openai\.chatgpt|com\.google\.android\.googlequicksearchbox)),(NETWORK,UDP)),US UDP'''

          if old not in s:
              raise SystemExit('Expected browser UDP rule not found; aborting')

          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit patched config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml
          git diff --cached --quiet || git commit -m "Strengthen Android WebRTC process matching"
          git push

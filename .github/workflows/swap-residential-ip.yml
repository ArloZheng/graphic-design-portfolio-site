name: Swap residential IP

on:
  push:
    paths:
      - '.github/workflows/swap-residential-ip.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace residential server IP
        run: |
          sed -i 's/server: 64\.32\.187\.195/server: 205.214.55.251/g' clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml
          sed -i 's/server: 64\.32\.187\.195/server: 205.214.55.251/g' clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml
      - name: Commit updated subscription configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml
          git diff --cached --quiet || git commit -m "Switch residential proxy server IP"
          git push

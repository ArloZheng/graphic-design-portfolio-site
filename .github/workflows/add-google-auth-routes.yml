name: Add Google auth routes
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml; do
            sed -i '/^rules:/a\- DOMAIN,accounts.google.com,US Transit\n- DOMAIN,oauth2.googleapis.com,US Transit\n- DOMAIN,people.googleapis.com,US Transit' "$f"
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml
          git commit -m 'Route Google auth endpoints through US Transit' || exit 0
          git push

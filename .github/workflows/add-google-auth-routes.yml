name: Apply Google AI whitelist

on:
  push:
    paths:
      - '.github/workflows/add-google-auth-routes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Apply exact AI whitelist routes
        shell: python
        run: |
          from pathlib import Path
          import yaml

          root = Path('clash/HApiBDgfuXsS4TD7YnASWlId')
          whitelist = [
              'aistudio.google.com',
              'gemini.google.com',
              'ai.google.dev',
              'generativelanguage.googleapis.com',
              'makersuite.google.com',
              'alkalimakersuite-pa.clients6.google.com',
              'accounts.google.com',
              'oauth2.googleapis.com',
              'people.googleapis.com',
              'identitytoolkit.googleapis.com',
              'securetoken.googleapis.com',
              'firebaseinstallations.googleapis.com',
          ]

          for filename in ['mobile.yaml', 'desktop.yaml']:
              path = root / filename
              doc = yaml.safe_load(path.read_text(encoding='utf-8-sig'))
              cleaned = []
              for rule in doc.get('rules', []):
                  if not isinstance(rule, str):
                      cleaned.append(rule)
                      continue
                  if rule.startswith('DOMAIN,'):
                      parts = rule.split(',')
                      if len(parts) >= 3 and parts[1] in whitelist:
                          continue
                  cleaned.append(rule)
              doc['rules'] = [f'DOMAIN,{domain},US Transit' for domain in whitelist] + cleaned
              path.write_text(yaml.safe_dump(doc, allow_unicode=True, sort_keys=False, width=100000), encoding='utf-8')

      - name: Commit whitelist routing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml
          git diff --cached --quiet || git commit -m "Apply maintainable Google AI whitelist routing"
          git push

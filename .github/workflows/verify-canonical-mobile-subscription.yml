name: Verify canonical mobile subscription

on:
  push:
    paths:
      - 'clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
      - 'clash/HApiBDgfuXsS4TD7YnASWlId/unified.yaml'
  pull_request:
    paths:
      - 'clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
      - 'clash/HApiBDgfuXsS4TD7YnASWlId/unified.yaml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the published mobile profile
        shell: python
        run: |
          from pathlib import Path
          import yaml

          root = Path('clash/HApiBDgfuXsS4TD7YnASWlId')
          mobile = yaml.safe_load((root / 'mobile.yaml').read_text(encoding='utf-8-sig'))
          assert mobile['mode'] == 'rule'
          assert 'tun' not in mobile
          assert 'tunnels' not in mobile
          residential = [proxy for proxy in mobile['proxies'] if proxy.get('type') == 'socks5']
          assert len(residential) == 1
          oregon = residential[0]
          assert oregon.get('server') == '205.214.55.251'
          assert oregon.get('dialer-proxy') == 'US1-HY2'
          assert mobile['proxy-groups'][-1]['name'] == 'Final Exit'
          assert mobile['proxy-groups'][-1]['type'] == 'fallback'
          assert mobile['proxy-groups'][-1]['proxies'] == [oregon['name']]
          assert mobile['rules'][-1] == 'MATCH,Final Exit'
          print('Canonical mobile subscription validation passed')

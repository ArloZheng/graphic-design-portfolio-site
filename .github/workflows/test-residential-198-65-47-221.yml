name: Test residential 198.65.47.221

on:
  push:
    paths:
      - '.github/workflows/test-residential-198-65-47-221.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test SOCKS5 authentication and HTTPS egress
        shell: bash
        run: |
          set +e
          OUT=$(curl --silent --show-error --max-time 30 \
            --proxy 'socks5h://9x20rcFkf6WE:ZZxkwowX62ty@198.65.47.221:7471' \
            https://api.ipify.org 2>/tmp/proxy-error.txt)
          RC=$?
          ERR=$(cat /tmp/proxy-error.txt)
          if [ "$RC" -eq 0 ] && [ -n "$OUT" ]; then
            STATUS=success
          else
            STATUS=failed
          fi
          {
            echo "status=$STATUS"
            echo "curl_exit_code=$RC"
            echo "observed_egress_ip=$OUT"
            echo "error=$ERR"
          } > clash/HApiBDgfuXsS4TD7YnASWlId/residential-198-65-47-221-test.txt
      - name: Commit test result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/residential-198-65-47-221-test.txt
          git diff --cached --quiet || git commit -m "Record connectivity test for residential 198.65.47.221"
          git push

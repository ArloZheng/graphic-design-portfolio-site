name: Repair desktop live nodes

on:
  push:
    paths:
      - '.github/workflows/repair-desktop-live-nodes.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet pyyaml
      - name: Convert desktop airport nodes to live provider
        shell: python
        run: |
          from pathlib import Path
          import subprocess, yaml

          root=Path('clash/HApiBDgfuXsS4TD7YnASWlId')
          desktop=root/'desktop.yaml'
          d=yaml.safe_load(desktop.read_text(encoding='utf-8-sig'))

          # Reuse the known working upstream airport provider URL from the morning mobile baseline.
          old_mobile=subprocess.check_output([
            'git','show','d73b2c45c5ac199a14aeafadd819cac2bbb6fdbb:clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
          ], text=True)
          m=yaml.safe_load(old_mobile)
          provider_url=m['proxy-providers']['airport']['url']

          # Keep only residential SOCKS5 exits in proxies; airport nodes come from live provider.
          residential=[p for p in d.get('proxies',[]) if isinstance(p,dict) and p.get('type')=='socks5']
          for p in residential:
            p['dialer-proxy']='Airport Front'
          d['proxies']=residential

          d['proxy-providers']={
            'airport':{
              'type':'http',
              'url':provider_url,
              'interval':3600,
              'path':'./proxy_provider/airport.yaml',
              'header':{'User-Agent':['clash.meta']},
              'health-check':{
                'enable':True,
                'url':'https://www.gstatic.com/generate_204',
                'interval':300
              }
            }
          }

          for g in d.get('proxy-groups',[]):
            name=g.get('name')
            if name=='Airport Front':
              g.clear(); g.update({'name':'Airport Front','type':'select','use':['airport']})
            elif name=='US Transit':
              g.clear(); g.update({
                'name':'US Transit','type':'select','use':['airport'],
                'filter':'^(?:US-1TCP|US1-HY2|US2-HY2|US3-HY2|US5-HY2|US6-HY2)$'
              })

          desktop.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=100000),encoding='utf-8')

      - name: Validate
        run: |
          python - <<'PY'
          import yaml
          p='clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml'
          d=yaml.safe_load(open(p,encoding='utf-8'))
          assert d['proxy-providers']['airport']['type']=='http'
          assert all(x.get('type')=='socks5' for x in d['proxies'])
          assert all(x.get('dialer-proxy')=='Airport Front' for x in d['proxies'])
          groups={g['name']:g for g in d['proxy-groups']}
          assert groups['Airport Front']['use']==['airport']
          assert groups['US Transit']['use']==['airport']
          assert d['rules'][-1]=='MATCH,Final Exit'
          print('desktop live-node provider config validated')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/desktop.yaml
          git diff --cached --quiet || git commit -m "Repair desktop with live airport provider"
          git push

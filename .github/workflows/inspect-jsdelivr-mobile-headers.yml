name: Inspect jsDelivr mobile headers

on:
  push:
    paths:
      - '.github/workflows/inspect-jsdelivr-mobile-headers.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch headers
        run: |
          curl -fsSL -D /tmp/headers.txt -o /dev/null \
            'https://cdn.jsdelivr.net/gh/ArloZheng/graphic-design-portfolio-site@main/clash/HApiBDgfuXsS4TD7YnASWlId/mobile.yaml'
          grep -Ei '^(age|cache-control|etag|last-modified|x-|cf-|server|date):' /tmp/headers.txt > clash/HApiBDgfuXsS4TD7YnASWlId/jsdelivr-mobile-headers.txt || true
          cat clash/HApiBDgfuXsS4TD7YnASWlId/jsdelivr-mobile-headers.txt
      - name: Commit headers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/jsdelivr-mobile-headers.txt
          git diff --cached --quiet || git commit -m "Record jsDelivr mobile response headers"
          git push

name: Build dedicated mobile subscription

on:
  push:
    paths:
      - '.github/workflows/build-mobile-dedicated.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pyyaml
      - name: Build minimal Android-focused profile
        shell: python
        run: |
          from pathlib import Path
          import yaml

          root=Path('clash/HApiBDgfuXsS4TD7YnASWlId')
          current=yaml.safe_load((root/'mobile.yaml').read_text(encoding='utf-8-sig'))
          airport=yaml.safe_load((root/'airport.yaml').read_text(encoding='utf-8-sig'))

          residential_names=['纽约州纽约市 168.158.76.54','俄勒冈州 205.214.55.251','亚利桑那州弗拉格斯塔夫 47.215.192.185']
          current_by_name={p.get('name'):p for p in current.get('proxies',[]) if isinstance(p,dict)}
          airport_by_name={p.get('name'):p for p in airport.get('proxies',[]) if isinstance(p,dict)}
          front_names=['US-1TCP','US-2TCP','US-3TCP','US-4TCP','US-5TCP']

          fronts=[dict(airport_by_name[n]) for n in front_names]
          residential=[]
          for n in residential_names:
              p=dict(current_by_name[n])
              p['dialer-proxy']='手机前置'
              p['ip-version']='ipv4'
              residential.append(p)

          profile={
            'mixed-port':7890,
            'allow-lan':False,
            'mode':'rule',
            'log-level':'info',
            'ipv6':False,
            'dns':{
              'enable':True,
              'ipv6':False,
              'enhanced-mode':'fake-ip',
              'fake-ip-range':'198.18.0.1/16',
              'default-nameserver':['223.5.5.5','119.29.29.29'],
              'nameserver':['https://dns.alidns.com/dns-query','https://doh.pub/dns-query'],
              'proxy-server-nameserver':['223.5.5.5','119.29.29.29']
            },
            'proxies':fronts+residential,
            'proxy-groups':[
              {'name':'手机前置','type':'select','proxies':front_names},
              {'name':'住宅出口','type':'select','proxies':residential_names},
            ],
            'rules':[
              'GEOSITE,CN,DIRECT',
              'GEOIP,CN,DIRECT,no-resolve',
              'NETWORK,UDP,手机前置',
              'MATCH,住宅出口',
            ]
          }

          out=root/'mobile-dedicated.yaml'
          out.write_text(yaml.safe_dump(profile,allow_unicode=True,sort_keys=False,width=100000),encoding='utf-8')

      - name: Validate dedicated profile
        run: |
          python - <<'PY'
          import yaml
          p='clash/HApiBDgfuXsS4TD7YnASWlId/mobile-dedicated.yaml'
          d=yaml.safe_load(open(p,encoding='utf-8'))
          assert len(d['proxies'])==8
          front=next(g for g in d['proxy-groups'] if g['name']=='手机前置')
          assert front['type']=='select' and len(front['proxies'])==5
          exitg=next(g for g in d['proxy-groups'] if g['name']=='住宅出口')
          assert exitg['type']=='select' and len(exitg['proxies'])==3
          for pxy in d['proxies'][-3:]:
              assert pxy['type']=='socks5'
              assert pxy['dialer-proxy']=='手机前置'
          assert d['rules'][-2]=='NETWORK,UDP,手机前置'
          assert d['rules'][-1]=='MATCH,住宅出口'
          print('dedicated mobile profile validated')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/HApiBDgfuXsS4TD7YnASWlId/mobile-dedicated.yaml
          git diff --cached --quiet || git commit -m "Add dedicated mobile subscription"
          git push
